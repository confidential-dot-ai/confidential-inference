        SGLANG_HRRN_SIZE_EXPONENT: '1.5'
        SGLANG_OPT_PREFIX_PROMPT_ENCODE: '1'
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '1200'
        SGLANG_OPT_DSV41_CED_BOUNDARY_HANDOFF: '1'
        SGLANG_FORWARD_UNKNOWN_TOOLS: '1'
