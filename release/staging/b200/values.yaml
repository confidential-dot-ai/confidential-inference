# Staging on one 8-GPU B200 node: DeepSeek-V4.1 in the prefill/decode layout
# (2 CED PP2 prefill + 2 TP2/EP2 decode, 2 GPUs each, one pod). Helm applies
# it after release/values.yaml and release/staging/values.yaml. It is not a
