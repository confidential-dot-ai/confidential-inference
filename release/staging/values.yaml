stagingValidation:
  enabled: true

runtimeConfig:
  # Remove the production routes. The chart uses the staging model below.
  modelRoutes: null

# Staging chart values
#
# Helm applies this file after release/values.yaml (release/profiles.json).
# It holds only what differs from production: the staging names, the CPU
# SGLang simulator, and the small model that the simulator first verifies on
# the encrypted model mount.

environment: staging

gateway:
  # The admin-next relay (admin/vm/caddy in the internal repository): key
  # snapshot GET and usage POST. Its address is the gateway's one exit.
  admin:
    url: https://ci-admin-next-loki.centralus.cloudapp.azure.com/api/usage/ingest
    address: 172.173.67.102
  usage:
    enabled: true
    models:
      deepseek-ai/DeepSeek-V4.1-Flash:
        served_model: deepseek-ai/DeepSeek-V4.1-Flash
        model_revision: 5254448103b6254fc646dacbca1cbbf20e9216c1
  protection:
    # The PD decode workers run 128 requests (release/staging/b200/values.yaml).
    inferenceConcurrency: 128
    inferenceQueue: 64
    # The node mesh proxy opens the final connection to the gateway.
    # Keep Pod proxies and the staging node network in the trusted scope.
    trustedProxyCidrs:
      - 10.52.0.0/16
      - 10.42.0.0/16

attestationReceipts:
  evidenceBaseUrl: https://staging.api.confidential.ai
  evidenceConnectHost: c8s-router.c8s-system.svc.cluster.local
  # The gateway verifies CDS for its schema 3 policy metadata. On c8s >= C8s
  # #1048 a member pod reaches CDS only at the node's bound endpoint: the
  # server address of the signed launch configuration (staging-20260926
  # CONTROL_IP) and the CDS NodePort. C8s admits that exit for every member
  # pod. The CDS armTLS certificate names no host; the gateway pins it by
  # attestation. The deployment supplies the two policy documents.
  cds:
    url: https://10.45.250.23:30808

# kube-state-metrics needs the Kubernetes API, which a c8s >= v0.64 mesh member
# pod cannot reach.
kubeStateMetrics:
  enabled: false

