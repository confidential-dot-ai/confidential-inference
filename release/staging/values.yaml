# Staging chart values
#
# Helm applies this file after release/values.yaml (release/profiles.json).
# It holds only what differs from production: the staging names and the CPU
# SGLang simulator, which first verifies the encrypted model mount.

environment: staging

attestationReceipts:
  evidenceBaseUrl: https://staging.api.confidential.ai
  releaseId: v0.14.0-staging

inference:
  mode: simulator
  gpusPerReplica: 0
  gpuArchitectures: []
  attestedGpuCount: 0
  resources:
    cpu: '2'
    memory: 16Gi
  simulator:
    validateModelMount: true
    outputMode: BLOCKING
    maxTotalTokens: 8192
    maxRunningRequests: 48
    chatTemplate: chatml

metricsCollector:
  remoteWrite:
    enabled: false
