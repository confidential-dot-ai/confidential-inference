# The engine and router images of confidential-dot-ai/confidential-sglang,
# pinned like C8s: by the confidential-sglang release record, not by our own
# image publication. `record` names the record (images-<first 12 hex of its
# source commit>); release/inputs/confidential-sglang/<record>.json holds its
# bytes, and the release build adds both images as images.confidentialSglangEngine
# and images.confidentialSglangRouter. Pin a record with
# `scripts/confidential_sglang_release.py pin images-<12hex>`; it changes the
# record line only (docs/confidential-sglang-images.md).
# images-000000000000 is the PLACEHOLDER until confidential-sglang publishes
# its first record. The release build refuses to build a release with it.
confidentialSglang:
  record: images-adebbab855e6
