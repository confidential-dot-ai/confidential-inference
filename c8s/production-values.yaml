environment: production

imagePullSecret:
  name: registry-pull

# The node names below are placeholders. The real node names are
# infrastructure values. They live in the confidential-inference-internal
# repository, in its environments files, and the deployment reads them from
# there. The chart renders them into a pod nodeSelector only, so they are
# not an input to the c8s allowlist.
scheduling:
  gatewayNodeName: gateway-node-1
  inferenceNodeName: inference-node-1

images:
  gateway: ghcr.io/confidential-dot-ai/confidential-inference/gateway@sha256:ea29a58f423ee4e8652450c2e1b2bf78c5b2bab8d12f977ad3a6772d104ba552
  sglang: ghcr.io/confidential-dot-ai/confidential-inference/sglang@sha256:2c9d540bd0b61648fb2e50d3a0ec244d0671f7314a8f9b43c51e91135739f81b
  sglangWorker: ghcr.io/confidential-dot-ai/confidential-inference/sglang@sha256:2c9d540bd0b61648fb2e50d3a0ec244d0671f7314a8f9b43c51e91135739f81b
  metricsCollector: ghcr.io/confidential-dot-ai/confidential-inference/metrics-collector@sha256:a54b2c88661cb5524913a0a83be54edece40c3f9547d4d0d4475e8b066becd75
  dcgmExporter: nvcr.io/nvidia/k8s/dcgm-exporter@sha256:b7a4241c608253aa829041cc3575ea57082491251a4a626bcdddc68eaf9a3101
  nodeExporter: quay.io/prometheus/node-exporter@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
  kubeStateMetrics: ghcr.io/confidential-dot-ai/confidential-inference/kube-state-metrics@sha256:9a661bfe84d567e3934e82c5f4f4e9acc1ab70e790c49e63a90e83ef3f349419
  c8sOperator: ghcr.io/confidential-dot-ai/c8s-operator@sha256:5e1a8e3a90e29ba4240a4ac37e92062af17d19f0ec62167ceb04f08180687723
  stateMounter: docker.io/library/ubuntu@sha256:1e0a86e57d247923571b75e0aaf48a1449cf8c543d51fb3e07a4a7d7bfa79316

namedWorkloadProxy:
  enabled: true

attestationReceipts:
  enabled: true
  legacyC8s615: false
  evidenceBaseUrl: https://api.confidential.ai
  releaseId: v0.13.27-static-attestation-20260909
  releaseBundleSha256: sha256:c0c536e164954463ba5623d05db3692883437a2a1a34e4d58830ea4db2affac5
  policyMode: static
  expectedStaticAllowlistSha256: sha256:05235c60dd61b239f3ac6a367b4fd6469008d766270002a235df4f54b02e217c
  targets:
    - {target: gateway, workload: gateway-db0b6ee, identity: gateway-db0b6ee, url: http://127.0.0.1:8800}
    - {target: sglang-router, workload: sglang-router-684393d, identity: sglang-router-684393d, url: http://sglang-router:8801}
    - {target: inference-worker-0, workload: inference-worker-0-tool-calls-v1, identity: inference-worker-0-tool-calls-v1, url: http://inference-worker-0-0.inference-workers:8802}
    - {target: inference-worker-1, workload: inference-worker-1-tool-calls-v1, identity: inference-worker-1-tool-calls-v1, url: http://inference-worker-1-0.inference-workers:8802}
    - {target: metrics-collector, workload: metrics-collector-a941ea9, identity: metrics-collector-a941ea9, url: http://metrics-collector:8803}
    - {target: kube-state-metrics, workload: kube-state-metrics-a941ea9, identity: kube-state-metrics-a941ea9, url: http://kube-state-metrics:8804}
  certificateRenewInterval: 30s
  gatewayPort: 8800
  routerPort: 8801
  firstWorkerPort: 8802
  metricsCollectorPort: 8803
  kubeStateMetricsPort: 8804
  platform: tdx
  attestationApiPort: 8400
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}

gateway:
  attestedWorkload: gateway-db0b6ee
  shutdownGraceSeconds: 900
  endpointDrainSeconds: 35
  terminationGracePeriodSeconds: 960
  c8sSecrets:
    apiKeyPepper: {name: GATEWAY_API_KEY_PEPPER, sourcePath: /confidential-inference/gateway/api-key-pepper}
  state:
    enabled: true
    storageResources: {create: true}
    absencePolicy: fail-closed
    startupTimeoutSeconds: 60
    databasePath: /var/lib/confidential-gateway/gateway.sqlite3
    mountPath: /var/lib/confidential-gateway
    claimName: gateway-state
    persistentVolumeName: gateway-state
    storageClassName: confidential-inference-gateway-state
    storageNamespace: kube-system
    size: 16Gi
    nodeName: gateway-node-1
    hostStateRootPath: /var/lib/confidential-inference/gateway-state-root
    hostMountPath: /var/lib/confidential-inference/gateway-state-root/data
    devicePath: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_confai-gateway-state
    diskSerial: confai-gateway-state
    allowFormat: true

inference:
  enabled: true
  mode: model
  replicas: 2
  gpusPerReplica: 4
  gpuArchitectures: [BLACKWELL]
  # Both workers share one 8-GPU node: each pod is allocated 4 devices, but
  # CVM driver-level evidence attests all 8 visible devices.
  attestedGpuCount: 8
  attestedWorkloads: [inference-worker-0-tool-calls-v1, inference-worker-1-tool-calls-v1]
  model:
    name: deepseek-ai/DeepSeek-V4-Flash-0731
    revision: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
    c8sVolumeSource: /confidential-inference/volumes/dsv4
    volumeNames: [dsv4, dsv4-1]
    mountVerification:
      expectedFiles:
        .model-lock-local-manifest.json: cd9eecd89a3d31dedd7b707158e86ebeab241c68d55e9661d3efa508015a697c
        config.json: 6c8f3d2d3b48707541b88f32f22ef3f0f8a6b57d8523281e2b8d3cdb0ae9a023
        model.safetensors.index.json: 98efab455cf08dfbbbaaba6f570e1bf10bf927d2b4c3c453a59c2f6f0e3be92b
        tokenizer_config.json: 6ac8c8dc065ed118161d02dd532749ae3f52c243deac27872134fae2f50d8547

router:
  attestedWorkload: sglang-router-684393d
  enabled: true

metricsCollector:
  enabled: true
  attestedWorkload: metrics-collector-a941ea9

kubeStateMetrics:
  attestedWorkload: kube-state-metrics-a941ea9
