name: V0 validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v0-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Puts the changed paths of this push or pull request into categories.
  # Each other job reads one or more category outputs. A job skips its
  # real work when the change does not match its categories. Every
  # category also matches a change to this workflow file. So a workflow
  # edit always runs every job. See "Continuous integration" in
  # README.md for the category table.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      helm-and-contracts: ${{ steps.filter.outputs.helm-and-contracts }}
      node-image-profile: ${{ steps.filter.outputs.node-image-profile }}
      release-bundle: ${{ steps.filter.outputs.release-bundle }}
      docs-only: ${{ steps.filter.outputs.docs-only }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Sort the changed paths into categories
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "services/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "images/gateway/Dockerfile"
              - "images/gateway/Dockerfile.dockerignore"
              - "images/gateway/build.sh"
              - "images/maintenance-gateway/Dockerfile"
              - ".github/workflows/v0-validation.yml"
            helm-and-contracts:
              - "helm/**"
              - "contracts/**"
              - "scripts/**"
              - "tests/**"
              - "!tests/images/control-plane-node/**"
              - ".github/workflows/v0-validation.yml"
            node-image-profile:
              - "images/control-plane-node/**"
              - "tests/images/control-plane-node/**"
              - ".github/workflows/v0-validation.yml"
            release-bundle:
              - "releases/**"
              - "c8s/**"
              - "images/*/source.lock"
              - ".github/workflows/v0-validation.yml"
            docs-only:
              - "**/*.md"

  # Runs the Rust unit tests and lints. These are the only checks that a
  # change to services/** or the Cargo files can break.
  rust:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up the Rust toolchain
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-04
        with:
          toolchain: stable

      - name: Check dependency licenses
        if: needs.changes.outputs.rust == 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses

      - name: Run the Rust test and lint suites
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo test --locked --package confidential-gateway
          cargo clippy --locked --package confidential-gateway --all-targets -- -D warnings
          cargo test --locked --package maintenance-gateway
          cargo clippy --locked --package maintenance-gateway --all-targets -- -D warnings

      - name: Report the skip
        if: needs.changes.outputs.rust != 'true'
        run: |
          echo "skipped: no relevant changes"

  # Runs the contract, Helm, and Python validation suites. A release-bundle
  # change (a bundle JSON, a c8s values file, or an image source lock) also
  # runs this job, because these suites validate the bundles and the pins
  # a release carries.
  helm-and-contracts:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        if: needs.changes.outputs.helm-and-contracts == 'true' || needs.changes.outputs.release-bundle == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        if: needs.changes.outputs.helm-and-contracts == 'true' || needs.changes.outputs.release-bundle == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt

      - name: Set up Helm
        if: needs.changes.outputs.helm-and-contracts == 'true' || needs.changes.outputs.release-bundle == 'true'
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.6

      - name: Install validation dependencies
        if: needs.changes.outputs.helm-and-contracts == 'true' || needs.changes.outputs.release-bundle == 'true'
        run: python -m pip install --requirement scripts/requirements-ci.txt

      - name: Run the contract, Helm, and Python validation suites
        if: needs.changes.outputs.helm-and-contracts == 'true' || needs.changes.outputs.release-bundle == 'true'
        env:
          V0_ALLOW_MISSING_PINNED_ROUTER_IMAGE: "1"
        run: |
          python3 -m unittest discover -s tests/contracts -p 'test_*.py'
          python3 -m unittest discover -s tests/c8s-install-v0 -p 'test_*.py'
          python3 -m unittest discover -s tests/attestation-v0 -p 'test_*.py'
          python3 -m unittest discover -s tests/attestation-receipts-v0 -p 'test_*.py'
          python3 -m unittest discover -s tests/image-workflow -p 'test_*.py'
          python3 -m unittest discover -s tests/network-v0 -p 'test_*.py'
          python3 -m unittest discover -s tests/images/gateway -p 'test_*.py'
          python3 -m unittest discover -s tests/images/sglang -p 'test_*.py'
          python3 -m unittest discover -s tests/model-mount-v0 -p 'test_*.py'
          python3 -m unittest discover -s tests/release-v0 -p 'test_*.py'
          python3 -m unittest discover -s tests/source-boundary -p 'test_*.py'
          python3 -m unittest discover -s tests/ci-workflow -p 'test_*.py'
          python3 scripts/validate-json.py
          python3 scripts/validate-source-boundary.py
          # inference.mode has no chart default, so this neutral lint must
          # state a mode. The choice does not matter here; it only proves
          # the chart lints.
          helm lint helm/confidential-inference --set inference.mode=simulator
          helm lint helm/maintenance-gateway
          helm template maintenance helm/maintenance-gateway --namespace maintenance >/dev/null
          bash tests/helm/run.sh
          scripts/validate-kubernetes.sh
          bash tests/router-v0/test_sglang_router.sh

      - name: Report the skip
        if: needs.changes.outputs.helm-and-contracts != 'true' && needs.changes.outputs.release-bundle != 'true'
        run: |
          echo "skipped: no relevant changes"

  # A change to the control-plane node profile is the only change that can
  # break the generated systemd units or the boot behavior they check.
  control-plane-node-boot-sim:
    # The boot simulation step is a separate step from the systemd unit
    # test, not a separate job: both need a privileged container with
    # cgroup v2 delegated (--cgroupns=host), which a fresh runner VM gives
    # cleanly but which the rest of this workflow does not need. See
    # tests/images/control-plane-node/boot-sim/run.sh and
    # images/control-plane-node/README.md, "Testing the profile".
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        if: needs.changes.outputs.node-image-profile == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        if: needs.changes.outputs.node-image-profile == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt

      - name: Install validation dependencies
        if: needs.changes.outputs.node-image-profile == 'true'
        run: python -m pip install --requirement scripts/requirements-ci.txt

      - name: Verify the generated systemd units
        if: needs.changes.outputs.node-image-profile == 'true'
        run: python3 -m unittest discover -s tests/images/control-plane-node -p 'test_*.py'

      - name: Run the control-plane node profile boot simulation
        if: needs.changes.outputs.node-image-profile == 'true'
        run: bash tests/images/control-plane-node/boot-sim/run.sh

      - name: Report the skip
        if: needs.changes.outputs.node-image-profile != 'true'
        run: |
          echo "skipped: no relevant changes"

  # A documentation-only change cannot break a test or a build. It can
  # only break a link or the Markdown itself.
  docs-only:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        if: needs.changes.outputs.docs-only == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        if: needs.changes.outputs.docs-only == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check Markdown links
        if: needs.changes.outputs.docs-only == 'true'
        run: python3 scripts/check-markdown-links.py

      - name: Report the skip
        if: needs.changes.outputs.docs-only != 'true'
        run: |
          echo "skipped: no relevant changes"
