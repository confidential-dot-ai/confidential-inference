name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: classify changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gateways=false
          python=false
          helm_app=false
          helm_maintenance=false
          config=false

          while IFS= read -r path; do
            case "$path" in
              services/gateway/*|tests/gateway/*|images/gateway/*|images/maintenance-gateway/*) gateways=true ;;
              scripts/*.py|images/*/*.py) python=true ;;
              helm/confidential-inference/*) helm_app=true ;;
              helm/maintenance-gateway/*) helm_maintenance=true ;;
              api/*.json|release/*.json|images/*/source.lock)
                config=true
                ;;
              .github/workflows/pr.yml)
                gateways=true
                python=true
                helm_app=true
                helm_maintenance=true
                config=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")

          {
            echo "gateways=$gateways"
            echo "python=$python"
            echo "helm_app=$helm_app"
            echo "helm_maintenance=$helm_maintenance"
            echo "config=$config"
          } >> "$GITHUB_OUTPUT"

      - name: install gateway Python
        if: steps.changes.outputs.gateways == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: test gateway containers
        if: steps.changes.outputs.gateways == 'true'
        env:
          GATEWAY_TEST_IMAGE: gateway-test
          MAINTENANCE_GATEWAY_TEST_IMAGE: maintenance-gateway-test
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m venv /tmp/gateway-tests
          /tmp/gateway-tests/bin/python -m pip install --require-hashes --only-binary=:all: \
            -r services/gateway/requirements.lock
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          docker build -f images/gateway/Dockerfile --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --build-arg "SOURCE_DATE_EPOCH=$epoch" -t "$GATEWAY_TEST_IMAGE" .
          docker build -f images/maintenance-gateway/Dockerfile --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --build-arg "SOURCE_DATE_EPOCH=$epoch" -t "$MAINTENANCE_GATEWAY_TEST_IMAGE" .
          /tmp/gateway-tests/bin/python -m unittest discover -s tests/gateway -q

      - name: check python syntax
        if: steps.changes.outputs.python == 'true'
        run: python3 -m compileall -q scripts images

      - name: install helm
        if: steps.changes.outputs.helm_app == 'true' || steps.changes.outputs.helm_maintenance == 'true'
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.14.4

      - name: lint app chart
        if: steps.changes.outputs.helm_app == 'true'
        run: helm lint helm/confidential-inference --set inference.mode=simulator

      - name: lint maintenance chart
        if: steps.changes.outputs.helm_maintenance == 'true'
        run: helm lint helm/maintenance-gateway

      - name: parse changed config
        if: steps.changes.outputs.config == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          while IFS= read -r -d '' path; do
            test -f "$path" || continue
            case "$path" in
              *.json|*/source.lock) python3 -m json.tool "$path" >/dev/null ;;
            esac
          done < <(git diff --name-only -z "$BASE_SHA" "$GITHUB_SHA" -- \
            'api/**' 'release/**' 'images/*/source.lock')

  # Every test suite, on every pull request: together they take about a minute.
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: install test deps
        run: |
          python3 -m pip install --user --break-system-packages --require-hashes \
            --requirement scripts/requirements-release-signing.txt

      # The Helm version of the C8s worker image build, which renders the C8s
      # seed (release/inputs/c8s-seeds/*.json helmVersion). The render and the
      # release build require it, so the tests use it too.
      - name: install helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.14.4

      - name: test python suites
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          failed=0
          run() { echo "::group::$*"; "$@" || { echo "::error::failed: $*"; failed=1; }; echo "::endgroup::"; }
          for suite in api image-workflow images/gateway images/sglang-confidential images/sglang-router network-v0 release-v1; do
            run python3 -m unittest discover -s "tests/$suite" -p 'test_*.py'
          done
          exit "$failed"

      - name: test chart
        run: |
          bash tests/helm/run.sh
          scripts/validate-kubernetes.sh
