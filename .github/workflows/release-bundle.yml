name: Signed release bundle

# A person pushes a protected tag vX.Y.Z on a main commit. This workflow
# builds the framework release of that commit, signs its manifest, and
# publishes the manifest and the chart package. It renders no allowlist and
# reads no deployment value.

on:
  push:
    tags:
      - "v[0-9]*"

permissions: {}

env:
  RELEASE_TAG: ${{ github.ref_name }}

concurrency:
  group: signed-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sign-release-bundle:
    name: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: signed-release-production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-release-signing.txt

      - name: install schema validator
        run: |
          python3 -m pip install --require-hashes \
            --requirement scripts/requirements-release-signing.txt

      - name: validate tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fix uses a new patch version. Tags are never moved or reused.
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release version is already published." >&2
            exit 1
          fi
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "A release tag is vX.Y.Z." >&2; exit 1; }
          # An earlier staging release pushed chart version X.Y.Z for vX.Y.Z-staging.
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}-staging" >/dev/null; then
            echo "${RELEASE_TAG}-staging exists, and its chart has version ${RELEASE_TAG#v}. Use a higher version." >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD refs/remotes/origin/main \
            || { echo "The release tag does not point to a commit on main." >&2; exit 1; }

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      # The release names the image publication of the nearest main commit at
      # or before the tag commit. No image build input may change in between.
      - name: find image evidence
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          select=(--tag "$RELEASE_TAG")
          python3 scripts/find-image-publication-run.py \
            --repository "$GITHUB_REPOSITORY" \
            --release-commit "$(git rev-parse HEAD)" \
            "${select[@]}" >> "$GITHUB_OUTPUT"

      - name: download image evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.publication.outputs.artifact_name }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.publication.outputs.run_id }}

      - name: check image evidence
        run: |
          python3 scripts/image-publication-manifest.py check \
            dist/image-publication-manifest.json

      - name: build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rev-parse HEAD > dist/release-tag-commit.txt
          python3 scripts/build-release-manifest.py \
            --tag "$RELEASE_TAG" \
            --source-commit "$(git rev-parse HEAD)" \
            --image-publication dist/image-publication-manifest.json \
            --output-dir dist

      - name: sign bundle
        run: |
          cosign sign-blob --yes \
            --bundle dist/release-bundle.sigstore.json \
            dist/release-bundle.json

      - name: verify signature offline
        run: |
          python3 scripts/verify-release-bundle-signature.py \
            --bundle dist/release-bundle.json \
            --signature-bundle dist/release-bundle.sigstore.json \
            --cosign "$(command -v cosign)"

      - name: upload release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release-${{ env.RELEASE_TAG }}
          path: |
            dist/release-bundle.json
            dist/release-bundle.sigstore.json
            dist/release-tag-commit.txt
            dist/image-publication-manifest.json
            dist/*.tgz
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: publish
    needs: sign-release-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # The chart package goes to GHCR from here, not from the signing job.
      packages: write
    steps:
      - name: download release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-release-${{ env.RELEASE_TAG }}
          path: dist

      - name: install helm
        run: |
          curl -fsSL -o /tmp/helm.tar.gz \
            https://get.helm.sh/helm-v3.14.4-linux-amd64.tar.gz
          echo "a5844ef2c38ef6ddf3b5a8f7d91e7e0e8ebc39a38bb3fc8013d629c1ef29c259  /tmp/helm.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm

      # The signed manifest binds the package by its SHA-256. The job never
      # replaces a pushed chart version: when the reference exists, it must
      # already be the signed package (a rerun). Otherwise the job pushes it,
      # then pulls it at the reference and proves it is the signed one.
      - name: push chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          reference="$(jq -r .chart.reference dist/release-bundle.json)"
          expected="$(jq -r .chart.archiveSha256 dist/release-bundle.json)"
          digest() { echo "sha256:$(sha256sum "$1" | cut -d' ' -f1)"; }
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          archives=(dist/*.tgz)
          test "${#archives[@]}" -eq 1 && test -e "${archives[0]}"
          test "$(digest "${archives[0]}")" = "$expected" \
            || { echo "The chart package differs from the signed manifest." >&2; exit 1; }
          mkdir "$RUNNER_TEMP/existing"
          if helm pull "oci://${reference%:*}" --version "${reference##*:}" --destination "$RUNNER_TEMP/existing" 2>/dev/null; then
            existing=("$RUNNER_TEMP"/existing/*.tgz)
            test "$(digest "${existing[0]}")" = "$expected" \
              || { echo "$reference exists with other bytes. Refusing to replace it." >&2; exit 1; }
          else
            helm push "${archives[0]}" "oci://${reference%/*}"
          fi
          mkdir "$RUNNER_TEMP/pulled"
          helm pull "oci://${reference%:*}" --version "${reference##*:}" --destination "$RUNNER_TEMP/pulled"
          pulled=("$RUNNER_TEMP"/pulled/*.tgz)
          test "$(digest "${pulled[0]}")" = "$expected" \
            || { echo "The chart at $reference is not the signed package." >&2; exit 1; }

      - name: publish github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_commit="$(tr -d '\n' < dist/release-tag-commit.txt)"
          case "$expected_commit" in
            *[!0-9a-f]*|'') echo "The signed tag commit is invalid." >&2; exit 1 ;;
          esac
          test "${#expected_commit}" -eq 40

          check_tag() {
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type + " " + .object.sha')"
            object_type="${object%% *}"
            object_sha="${object#* }"
            for _ in 1 2 3 4; do
              test "$object_type" = tag || break
              object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object.type + " " + .object.sha')"
              object_type="${object%% *}"
              object_sha="${object#* }"
            done
            test "$object_type" = commit && test "$object_sha" = "$expected_commit"
          }
          if ! check_tag; then
            echo "The release tag moved after signing. Refusing publication." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The GitHub Release already exists. Refusing to replace signed assets." >&2
            exit 1
          fi
          if ! check_tag; then
            echo "The release tag changed during publication. Refusing publication." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$expected_commit" \
            --title "$RELEASE_TAG" \
            --notes "Signed Confidential Inference framework release. The signed file is the release manifest built from release/spec.yaml at the tag commit. It names every image digest, the chart package, C8s and the node image. It holds no deployment settings: each deployment renders its own allowlist with scripts/render-allowlist.py." \
            "dist/release-bundle.json#Release bundle" \
            "dist/release-bundle.sigstore.json#Sigstore verification bundle" \
            "dist/release-tag-commit.txt#Signed tag commit" \
            "dist/image-publication-manifest.json#Image publication evidence" \
            dist/*.tgz
