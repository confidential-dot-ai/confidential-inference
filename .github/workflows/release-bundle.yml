name: Signed release bundle

on:
  push:
    tags:
      - "v[0-9]*"

permissions: {}

concurrency:
  group: signed-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The release profile of the tag selects the signing environment, so it is
  # read before the signing job starts.
  select-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      directory: ${{ steps.profile.outputs.directory }}
      environment: ${{ steps.profile.outputs.environment }}
      signing_environment: ${{ steps.profile.outputs.signing_environment }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select the release profile
        id: profile
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release_profiles.py resolve --tag "$RELEASE_TAG" --format github \
            >> "$GITHUB_OUTPUT"

  sign-release-bundle:
    needs: select-profile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ needs.select-profile.outputs.signing_environment }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the fixed Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-release-signing.txt

      - name: Install hash-locked schema validation
        run: |
          python3 -m pip install --require-hashes \
            --requirement scripts/requirements-release-signing.txt

      - name: Validate the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # A fix uses a new patch version. Tags are never moved or reused.
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release version is already published." >&2
            exit 1
          fi
          python3 scripts/validate-release-tag.py \
            --tag "$RELEASE_TAG" \
            --main-ref refs/remotes/origin/main

      - name: Install the pinned Helm
        run: |
          curl -fsSL -o /tmp/helm.tar.gz \
            https://get.helm.sh/helm-v3.14.4-linux-amd64.tar.gz
          echo "a5844ef2c38ef6ddf3b5a8f7d91e7e0e8ebc39a38bb3fc8013d629c1ef29c259  /tmp/helm.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Install the pinned crane
        run: |
          curl -fsSL -o /tmp/crane.tar.gz \
            https://github.com/google/go-containerregistry/releases/download/v0.21.6/go-containerregistry_Linux_x86_64.tar.gz
          echo "7ebbdcd05b652345c1f5105f8475e518534b90d66f3bdb50017be63f426ea435  /tmp/crane.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/crane.tar.gz -C /tmp crane
          sudo install -m 0755 /tmp/crane /usr/local/bin/crane

      # The allowlist needs the configuration of each repository image, which
      # crane reads from the registry by digest.
      - name: Log in to GHCR to read the image configuration
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install the pinned Cosign verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      # The release names the image publication of the nearest main commit at
      # or before the tag commit. No image build input may change in between.
      - name: Find the image publication evidence
        id: publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/find-image-publication-run.py \
            --repository "$GITHUB_REPOSITORY" \
            --release-commit "$(git rev-parse HEAD)" \
            --tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download the verified image publication evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.publication.outputs.artifact_name }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.publication.outputs.run_id }}

      - name: Check the image publication evidence
        run: |
          python3 scripts/image-publication-manifest.py check \
            dist/image-publication-manifest.json

      - name: Read the pinned c8s source commit
        id: c8s
        env:
          RELEASE_DIRECTORY: ${{ needs.select-profile.outputs.directory }}
        run: |
          python3 - "$RELEASE_DIRECTORY" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import release_profiles
          profile = release_profiles.for_directory(Path(sys.argv[1]))
          print("source_commit=" + release_profiles.read_spec(profile)["c8s"]["sourceCommit"])
          PY

      - name: Check out the pinned c8s source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: confidential-dot-ai/c8s
          ref: ${{ steps.c8s.outputs.source_commit }}
          path: c8s-source
          persist-credentials: false

      - name: Set up the Go toolchain of the pinned c8s
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: c8s-source/go.mod
          cache: false

      # The build from a cold cache took 108 s of each signing run. A run on
      # a tag can restore only caches of main, and warm-c8s-go-cache.yml
      # saves them there with this key, after a reviewed merge. The caches
      # of main are written only by workflows that run reviewed main code.
      # Release apply in the internal repository rebuilds every release
      # asset with a SHA-256-pinned c8s CLI and refuses a byte mismatch, so
      # a cache that changed the build fails closed.
      - name: Restore the Go caches of the pinned c8s
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: c8s-go-${{ runner.os }}-${{ steps.c8s.outputs.source_commit }}-${{ hashFiles('c8s-source/go.sum', 'tools/c8s-allowlist-canonical/go.sum') }}

      - name: Build the pinned c8s CLI and the canonical allowlist tool
        env:
          GOPRIVATE: github.com/confidential-dot-ai/*
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          (cd c8s-source && go build -o "$RUNNER_TEMP/bin/c8s" ./cmd/c8s)
          (cd tools/c8s-allowlist-canonical && go build -o "$RUNNER_TEMP/bin/c8s-allowlist-canonical" .)

      # An image that did not change after the base release of the image run
      # keeps the digest of the signed base release manifest. The build reads
      # the base from the evidence and downloads and verifies that release.
      - name: Build the release at the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git rev-parse HEAD > dist/release-tag-commit.txt
          python3 scripts/build-release-manifest.py \
            --tag "$RELEASE_TAG" \
            --source-commit "$(git rev-parse HEAD)" \
            --image-publication dist/image-publication-manifest.json \
            --c8s "$RUNNER_TEMP/bin/c8s" \
            --canonical-tool "$RUNNER_TEMP/bin/c8s-allowlist-canonical" \
            --output-dir dist

      - name: Create the keyless Sigstore bundle
        run: |
          cosign sign-blob --yes \
            --bundle dist/release-bundle.sigstore.json \
            dist/release-bundle.json

      - name: Verify the release without network trust lookup
        run: |
          python3 scripts/verify-release-bundle-signature.py \
            --bundle dist/release-bundle.json \
            --signature-bundle dist/release-bundle.sigstore.json \
            --cosign "$(command -v cosign)"

      # The manifest binds each profile values file by digest and names its
      # asset; the deploy applies the assets, not a checkout.
      - name: Copy the profile values files next to the manifest
        run: |
          python3 - <<'EOF'
          import json, pathlib, shutil
          manifest = json.loads(pathlib.Path("dist/release-bundle.json").read_text())
          for entry in manifest["profileValues"]:
              shutil.copyfile(entry["path"], pathlib.Path("dist") / entry["asset"])
          EOF

      - name: Save the immutable workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release-${{ github.ref_name }}
          path: |
            dist/release-bundle.json
            dist/release-bundle.sigstore.json
            dist/release-tag-commit.txt
            dist/image-publication-manifest.json
            dist/allowlist.json
            dist/release-values.yaml
            dist/profile-values-*.yaml
          if-no-files-found: error
          retention-days: 90

      # Only a staging release packages the chart (one package per source
      # commit); a production release binds the staging package.
      - name: Save the chart package of a staging release
        if: needs.select-profile.outputs.environment == 'staging'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chart-package-${{ github.ref_name }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 90

  publish-release:
    needs: [select-profile, sign-release-bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # The chart package goes to GHCR from here, not from the signing job.
      packages: write
    steps:
      - name: Download the verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-release-${{ github.ref_name }}
          path: dist

      - name: Download the chart package of a staging release
        if: needs.select-profile.outputs.environment == 'staging'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chart-package-${{ github.ref_name }}
          path: dist

      - name: Install the pinned Helm
        run: |
          curl -fsSL -o /tmp/helm.tar.gz \
            https://get.helm.sh/helm-v3.14.4-linux-amd64.tar.gz
          echo "a5844ef2c38ef6ddf3b5a8f7d91e7e0e8ebc39a38bb3fc8013d629c1ef29c259  /tmp/helm.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Install the pinned crane
        run: |
          curl -fsSL -o /tmp/crane.tar.gz \
            https://github.com/google/go-containerregistry/releases/download/v0.21.6/go-containerregistry_Linux_x86_64.tar.gz
          echo "7ebbdcd05b652345c1f5105f8475e518534b90d66f3bdb50017be63f426ea435  /tmp/crane.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/crane.tar.gz -C /tmp crane
          sudo install -m 0755 /tmp/crane /usr/local/bin/crane

      # The signed manifest binds the package by its SHA-256, which is the
      # digest of the chart layer in the registry. A staging release pushes
      # its package; every release then proves the package at the reference
      # is the signed one, so a production release finds its staging package.
      - name: Push the chart package and prove the reference holds the signed one
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 - <<'EOF' > "$RUNNER_TEMP/chart.env"
          import json, pathlib
          chart = json.loads(pathlib.Path("dist/release-bundle.json").read_text())["chart"]
          print(f"CHART_REFERENCE={chart['reference']}")
          print(f"CHART_ARCHIVE_SHA256={chart['archiveSha256']}")
          EOF
          . "$RUNNER_TEMP/chart.env"
          archives=(dist/*.tgz)
          if [ -e "${archives[0]}" ]; then
            test "${#archives[@]}" -eq 1
            test "sha256:$(sha256sum "${archives[0]}" | cut -d' ' -f1)" = "$CHART_ARCHIVE_SHA256" \
              || { echo "The chart package differs from the signed manifest." >&2; exit 1; }
            printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            helm push "${archives[0]}" "oci://${CHART_REFERENCE%/*}"
          fi
          printf '%s' "$GITHUB_TOKEN" | crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          layer="$(crane manifest "$CHART_REFERENCE" \
            | python3 -c 'import json, sys; m = json.load(sys.stdin); print(m["layers"][0]["digest"])')"
          test "$layer" = "$CHART_ARCHIVE_SHA256" \
            || { echo "The chart at $CHART_REFERENCE is not the signed package ($layer)." >&2; exit 1; }

      - name: Publish new GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected_commit="$(tr -d '\n' < dist/release-tag-commit.txt)"
          case "$expected_commit" in
            *[!0-9a-f]*|'') echo "The signed tag commit is invalid." >&2; exit 1 ;;
          esac
          test "${#expected_commit}" -eq 40

          check_tag() {
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type + " " + .object.sha')"
            object_type="${object%% *}"
            object_sha="${object#* }"
            for _ in 1 2 3 4; do
              test "$object_type" = tag || break
              object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object.type + " " + .object.sha')"
              object_type="${object%% *}"
              object_sha="${object#* }"
            done
            test "$object_type" = commit && test "$object_sha" = "$expected_commit"
          }
          if ! check_tag; then
            echo "The release tag moved after signing. Refusing publication." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The GitHub Release already exists. Refusing to replace signed assets." >&2
            exit 1
          fi
          if ! check_tag; then
            echo "The release tag changed during publication. Refusing publication." >&2
            exit 1
          fi
          # A production release has no package of its own (it binds the
          # staging one), so the package is attached only when present.
          shopt -s nullglob
          extra_assets=(dist/profile-values-*.yaml dist/*.tgz)
          shopt -u nullglob
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$expected_commit" \
            --title "$RELEASE_TAG" \
            --notes "Signed Confidential Inference release. The signed file is the release manifest built from release/ at the tag commit. It binds allowlist.json, release-values.yaml, the profile values files and the chart package by SHA-256." \
            "dist/release-bundle.json#Release bundle" \
            "dist/release-bundle.sigstore.json#Sigstore verification bundle" \
            "dist/release-tag-commit.txt#Signed tag commit" \
            "dist/image-publication-manifest.json#Image publication evidence" \
            "dist/allowlist.json#c8s allowlist" \
            "dist/release-values.yaml#Release image values" \
            "${extra_assets[@]}"
