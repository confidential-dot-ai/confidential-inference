name: Signed release bundle

on:
  push:
    tags:
      - "v[0-9]*"
      - "integration-staging-v[0-9]*"
      - "conf-inference-prod-v[0-9]*"

permissions: {}

concurrency:
  group: signed-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sign-release-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ startsWith(github.ref_name, 'integration-staging-v') && 'signed-release-integration-staging' || startsWith(github.ref_name, 'conf-inference-prod-v') && 'signed-release-conf-inference-prod' || 'signed-release-production' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the fixed Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-release-signing.txt

      - name: Install hash-locked schema validation
        run: |
          python3 -m pip install --require-hashes \
            --requirement scripts/requirements-release-signing.txt

      - name: Validate the production release tag
        if: startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$'
          if [[ ! "$RELEASE_TAG" =~ $release_pattern ]]; then
            echo "The production release tag must use vX.Y.Z or vX.Y.Z-rc.N." >&2
            exit 1
          fi

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release version is already published." >&2
            exit 1
          fi

          arguments=(
            --tag "$RELEASE_TAG"
            --bundle releases/production/release-bundle.json
            --main-ref refs/remotes/origin/main
          )
          if [[ ! "$RELEASE_TAG" =~ -rc\.[1-9][0-9]*$ ]]; then
            escaped_tag="${RELEASE_TAG//./\\.}"
            candidate_pattern="^${escaped_tag}-rc\.[1-9][0-9]*$"
            candidate_tag=""
            while IFS= read -r possible_tag; do
              if [[ "$possible_tag" =~ $candidate_pattern ]] && \
                gh release view "$possible_tag" \
                  --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                candidate_tag="$possible_tag"
                break
              fi
            done < <(
              git tag --list "$RELEASE_TAG-rc.*" --sort=-version:refname
            )
            if [[ -z "$candidate_tag" ]]; then
              echo "The final release has no release candidate." >&2
              exit 1
            fi
            mkdir -p /tmp/confidential-inference-candidate
            gh release download "$candidate_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern release-bundle.json \
              --pattern release-bundle.sigstore.json \
              --dir /tmp/confidential-inference-candidate
            arguments+=(
              --candidate-tag "$candidate_tag"
              --candidate-bundle \
                /tmp/confidential-inference-candidate/release-bundle.json
            )
          fi
          python3 scripts/validate-release-tag.py "${arguments[@]}"

      - name: Prepare the exact release bytes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) source=releases/production/release-bundle.json ;;
            integration-staging-v[0-9]*) source=releases/integration-staging/release-bundle.json ;;
            conf-inference-prod-v[0-9]*) source=releases/conf-inference-prod/release-bundle.json ;;
            *) echo "The release tag is not allowed." >&2; exit 1 ;;
          esac
          python3 scripts/prepare-signed-release.py \
            --source "$source" \
            --output dist/release-bundle.json \
            --tag-commit-output dist/release-tag-commit.txt \
            --tag "$RELEASE_TAG"

      - name: Install the pinned Cosign verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Verify the selected release candidate
        run: |
          candidate=/tmp/confidential-inference-candidate/release-bundle.json
          if [[ -f "$candidate" ]]; then
            python3 scripts/verify-release-bundle-signature.py \
              --bundle "$candidate" \
              --signature-bundle \
                /tmp/confidential-inference-candidate/release-bundle.sigstore.json \
              --cosign "$(command -v cosign)"
          fi

      - name: Create the keyless Sigstore bundle
        run: |
          cosign sign-blob --yes \
            --bundle dist/release-bundle.sigstore.json \
            dist/release-bundle.json

      - name: Verify the release without network trust lookup
        run: |
          python3 scripts/verify-release-bundle-signature.py \
            --bundle dist/release-bundle.json \
            --signature-bundle dist/release-bundle.sigstore.json \
            --cosign "$(command -v cosign)"

      - name: Save the immutable workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release-${{ github.ref_name }}
          path: |
            dist/release-bundle.json
            dist/release-bundle.sigstore.json
            dist/release-tag-commit.txt
          if-no-files-found: error
          retention-days: 90

  publish-release:
    needs: sign-release-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-release-${{ github.ref_name }}
          path: dist

      - name: Publish new GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected_commit="$(tr -d '\n' < dist/release-tag-commit.txt)"
          case "$expected_commit" in
            *[!0-9a-f]*|'') echo "The signed tag commit is invalid." >&2; exit 1 ;;
          esac
          test "${#expected_commit}" -eq 40

          check_tag() {
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type + " " + .object.sha')"
            object_type="${object%% *}"
            object_sha="${object#* }"
            for _ in 1 2 3 4; do
              test "$object_type" = tag || break
              object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object.type + " " + .object.sha')"
              object_type="${object%% *}"
              object_sha="${object#* }"
            done
            test "$object_type" = commit && test "$object_sha" = "$expected_commit"
          }
          if ! check_tag; then
            echo "The release tag moved after signing. Refusing publication." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The GitHub Release already exists. Refusing to replace signed assets." >&2
            exit 1
          fi
          if ! check_tag; then
            echo "The release tag changed during publication. Refusing publication." >&2
            exit 1
          fi
          release_flags=()
          if [[ "$RELEASE_TAG" =~ -rc\.[0-9]+$ ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$expected_commit" \
            --title "$RELEASE_TAG" \
            --notes "Signed Confidential Inference release bundle." \
            "${release_flags[@]}" \
            "dist/release-bundle.json#Release bundle" \
            "dist/release-bundle.sigstore.json#Sigstore verification bundle" \
            "dist/release-tag-commit.txt#Signed tag commit"
