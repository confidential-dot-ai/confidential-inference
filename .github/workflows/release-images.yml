name: Release images

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish each selected image after two deterministic rebuilds
        required: true
        type: boolean
        default: false
      rebuild_audit:
        description: Separately rebuild each selected image twice and compare it
        required: true
        type: boolean
        default: false
      # Unused. The evidence names the image source commit. Kept for one
      # release so that callers that still pass it do not fail; remove it
      # after confidential-inference-internal stops passing it.
      release_version:
        description: Unused; kept for callers that still pass it
        required: false
        type: string
      base_ref:
        description: Prior release tag or commit used to find affected images
        required: true
        type: string
      base_ref_commit:
        description: Immutable commit resolved from base_ref during review
        required: true
        type: string
  # An unsigned branch build (release-bundle.yml by workflow dispatch) builds
  # each affected image once, with no audit, against the nearest staging
  # release tag. Only a caller can ask for it, and the signed release never
  # takes its evidence: it trusts release-images.yml runs on main only.
  workflow_call:
    inputs:
      single_build:
        type: boolean
        required: true
    outputs:
      names:
        description: The images that this run published (empty when none changed)
        value: ${{ jobs.select-images.outputs.names }}

permissions:
  contents: read

# Do not use a concurrency group here. Each dispatch must finish its own
# build and audit. A shared group can cancel a running or pending request
# when staging or another release dispatches a build at main.

env:
  REGISTRY: ghcr.io
  BUILDX_VERSION: v0.36.1
  BUILDKIT_IMAGE: moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

jobs:
  # A run on a branch publishes the images of an unsigned branch build
  # (release-bundle.yml by workflow_dispatch). A signed release trusts only
  # the runs on main (scripts/find-image-publication-run.py).
  select-images:
    name: select images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      standard_matrix: ${{ steps.select.outputs.standard_matrix }}
      standard_pass_matrix: ${{ steps.select.outputs.standard_pass_matrix }}
      sglang: ${{ steps.select.outputs.sglang }}
      names: ${{ steps.select.outputs.names }}
      standard_names: ${{ steps.select.outputs.standard_names }}
      base_ref: ${{ steps.base.outputs.base_ref }}
      base_ref_commit: ${{ steps.base.outputs.base_ref_commit }}
    steps:
      - name: checkout with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: require audit
        if: ${{ !inputs.single_build }}
        env:
          PUBLISH: ${{ inputs.publish }}
          REBUILD_AUDIT: ${{ inputs.rebuild_audit }}
        run: |
          if [[ "$PUBLISH" == true && "$REBUILD_AUDIT" != true ]]; then
            echo "Publication requires the deterministic rebuild audit." >&2
            exit 1
          fi

      - name: verify base ref
        id: base
        env:
          BASE_REF: ${{ inputs.base_ref }}
          BASE_REF_COMMIT: ${{ inputs.base_ref_commit }}
          SINGLE_BUILD: ${{ inputs.single_build }}
        run: |
          if [[ "$SINGLE_BUILD" == true ]]; then
            BASE_REF="$(git describe --tags --abbrev=0 --match 'v[0-9]*-staging' HEAD)"
            BASE_REF_COMMIT="$(git rev-parse --verify "${BASE_REF}^{commit}")"
          fi
          [[ "$BASE_REF_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          resolved="$(git rev-parse --verify "${BASE_REF}^{commit}")"
          test "$resolved" = "$BASE_REF_COMMIT"
          printf 'base_ref=%s\n' "$BASE_REF" >> "$GITHUB_OUTPUT"
          printf 'base_ref_commit=%s\n' "$BASE_REF_COMMIT" >> "$GITHUB_OUTPUT"

      - name: select images
        id: select
        env:
          BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: >-
          python3 scripts/affected-release-images.py
          --base-ref "$BASE_REF"
          --head "$GITHUB_SHA"
          >> "$GITHUB_OUTPUT"

      - name: require an image
        if: inputs.publish && !inputs.single_build
        env:
          AFFECTED_IMAGES: ${{ steps.select.outputs.names }}
        run: |
          if [[ -z "$AFFECTED_IMAGES" ]]; then
            echo "Publication selected no image. Refusing a release run without evidence." >&2
            exit 1
          fi

      - name: report selection
        env:
          AFFECTED_IMAGES: ${{ steps.select.outputs.names }}
          BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: |
          printf "### Image source %s\n\nBase: \`%s\`\n\nAffected images: \`%s\`\n" \
            "$GITHUB_SHA" "$BASE_REF" "${AFFECTED_IMAGES:-none}" >> "$GITHUB_STEP_SUMMARY"

  # Each clean build of a standard image gets its own runner, as the sglang
  # builds below do. One job that built twice in sequence took twice as long
  # (run 37609914612: 128 s + 128 s for the gateway).
  reproducibility:
    name: 'rebuild ${{ matrix.image }} #${{ matrix.pass }}'
    if: >-
      inputs.rebuild_audit &&
      needs.select-images.outputs.standard_names != ''
    needs: select-images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-images.outputs.standard_pass_matrix) }}
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: check clean source
        id: source
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f "${{ matrix.dockerfile }}"
          printf 'epoch=%s\n' "$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: setup buildx
        id: builder
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          name: release-${{ matrix.pass }}-${{ github.run_id }}-${{ matrix.image }}
          driver: docker-container
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: build image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          builder: ${{ steps.builder.outputs.name }}
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          platforms: linux/amd64
          no-cache: true
          push: false
          outputs: type=oci,dest=/tmp/${{ matrix.image }}-${{ matrix.pass }}.tar,rewrite-timestamp=true
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.source=https://github.com/confidential-dot-ai/confidential-inference
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          provenance: false
          sbom: false

      # The image digest that buildx reports. Equal digests mean equal
      # manifest and configuration bytes, labels included.
      - name: record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$DIGEST" > /tmp/${{ matrix.image }}-${{ matrix.pass }}.digest

      - name: upload digest record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-record-${{ matrix.image }}-${{ matrix.pass }}
          path: /tmp/${{ matrix.image }}-${{ matrix.pass }}.digest
          if-no-files-found: error
          retention-days: 1

      # The publish job pushes these audited bytes. It does not build again.
      - name: upload oci archive
        if: inputs.publish && matrix.pass == 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-oci-${{ matrix.image }}
          path: /tmp/${{ matrix.image }}-1.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  reproducibility-compare:
    name: 'compare ${{ matrix.image }}'
    if: >-
      inputs.rebuild_audit &&
      needs.select-images.outputs.standard_names != ''
    needs: [select-images, reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-images.outputs.standard_matrix) }}
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 'download record #1'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-record-${{ matrix.image }}-1
          path: /tmp/record-1

      - name: 'download record #2'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-record-${{ matrix.image }}-2
          path: /tmp/record-2

      - name: compare digests
        run: |
          cmp /tmp/record-1/${{ matrix.image }}-1.digest /tmp/record-2/${{ matrix.image }}-2.digest \
            || { echo "The two clean builds differ." >&2; exit 1; }
          cp /tmp/record-1/${{ matrix.image }}-1.digest /tmp/${{ matrix.image }}.platform-digest

      - name: upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-platform-digest-${{ matrix.image }}
          path: /tmp/${{ matrix.image }}.platform-digest
          if-no-files-found: error
          retention-days: 1

  # The sglang image is ~20 GB. Building it clean twice in one job, even
  # after relocating Docker's data root and the OCI output to /mnt, still
  # exhausts the runner's root disk (`No space left on device` writing the
  # runner's own _diag log during the first build; see PRs #16 and #21,
  # which freed more root space and still failed identically). One clean
  # sglang build fits on a runner (the single-build publish job proves
  # this); two in sequence do not. Give each clean build its own runner
  # instead: two independent jobs record a small manifest/digest each,
  # and a third job compares the two recordings.
  reproducibility-sglang-build:
    name: 'rebuild sglang #${{ matrix.pass }}'
    if: >-
      inputs.rebuild_audit &&
      needs.select-images.outputs.sglang == 'true'
    needs: select-images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2]
    env:
      TMPDIR: /mnt/tmp
      DOCKER_TMPDIR: /mnt/tmp
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: check clean source
        id: source
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f "images/sglang/Dockerfile"
          printf 'epoch=%s\n' "$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: free disk space
        run: |
          echo "--- disk before cleanup ---"
          df -h / /mnt || true
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/local/julia* \
            /usr/local/lib/heroku /opt/az /usr/local/share/boost /usr/share/miniconda \
            /usr/lib/jvm /opt/microsoft /usr/local/share/chromium /usr/local/lib/node_modules \
            /usr/local/aws-cli /usr/share/google-cloud-sdk /usr/local/games \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" \
            2>/dev/null || true
          sudo apt-get purge -y --auto-remove \
            '^ghc-.*' '^dotnet-.*' '^llvm-.*' '^mysql-.*' '^php.*' azure-cli \
            google-cloud-cli google-chrome-stable firefox powershell mono-devel \
            libgl1-mesa-dri '^temurin-.*' \
            2>/dev/null || true
          sudo apt-get clean
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile 2>/dev/null || true
          sudo service docker stop
          sudo mkdir -p /mnt/docker-data /mnt/tmp /mnt/release-oci
          sudo chown "$(id -u):$(id -g)" /mnt/tmp /mnt/release-oci
          printf '{"data-root":"/mnt/docker-data"}\n' | sudo tee /etc/docker/daemon.json
          sudo rm -rf /var/lib/docker
          sudo service docker start
          echo "--- disk after cleanup ---"
          df -h / /mnt
          echo "--- confirm the Docker data root actually moved ---"
          root_dir=$(docker info --format '{{.DockerRootDir}}')
          echo "DockerRootDir=$root_dir"
          test "$root_dir" = /mnt/docker-data

      - name: setup buildx
        id: builder
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          name: release-sglang-${{ github.run_id }}-${{ matrix.pass }}
          driver: docker-container
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: watch disk usage
        run: |
          (while true; do
            printf '\n--- %s ---\n' "$(date -u +%FT%TZ)"
            df -h / /mnt
            sleep 30
          done) > /mnt/disk-usage-${{ matrix.pass }}.log 2>&1 &
          echo "watcher_pid=$!" >> "$GITHUB_OUTPUT"
        id: disk-watch

      - name: build image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          builder: ${{ steps.builder.outputs.name }}
          context: images/sglang
          file: images/sglang/Dockerfile
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          platforms: linux/amd64
          no-cache: true
          push: false
          outputs: type=oci,dest=/mnt/release-oci/sglang-${{ matrix.pass }}.tar,rewrite-timestamp=true
          labels: |
            org.opencontainers.image.title=Confidential Inference SGLang
            org.opencontainers.image.source=https://github.com/confidential-dot-ai/confidential-inference
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          provenance: false
          sbom: false

      - name: stop disk watcher
        if: always()
        run: kill "${{ steps.disk-watch.outputs.watcher_pid }}" 2>/dev/null || true

      - name: upload disk log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sglang-disk-usage-${{ matrix.pass }}
          path: /mnt/disk-usage-${{ matrix.pass }}.log
          if-no-files-found: ignore
          retention-days: 1

      - name: record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$DIGEST" > /tmp/sglang-${{ matrix.pass }}.digest

      - name: upload digest record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sglang-record-${{ matrix.pass }}
          path: /tmp/sglang-${{ matrix.pass }}.digest
          if-no-files-found: error
          retention-days: 1

  reproducibility-sglang-compare:
    name: compare sglang
    if: >-
      inputs.rebuild_audit &&
      needs.select-images.outputs.sglang == 'true'
    needs: [select-images, reproducibility-sglang-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 'download record #1'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-sglang-record-1
          path: /tmp/sglang-1

      - name: 'download record #2'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-sglang-record-2
          path: /tmp/sglang-2

      - name: compare digests
        run: |
          cmp /tmp/sglang-1/sglang-1.digest /tmp/sglang-2/sglang-2.digest \
            || { echo "The two clean builds differ." >&2; exit 1; }
          cp /tmp/sglang-1/sglang-1.digest /tmp/sglang.platform-digest

      - name: upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-platform-digest-sglang
          path: /tmp/sglang.platform-digest
          if-no-files-found: error
          retention-days: 1

  # A standard image is published from the OCI archive that its audit built
  # and proved, so the pushed digest is the audited digest by construction.
  # It starts as soon as the standard audit ends, without the sglang audit.
  publish-standard:
    name: 'publish ${{ matrix.image }}'
    if: >-
      always() &&
      inputs.publish &&
      needs.select-images.result == 'success' &&
      needs.select-images.outputs.standard_names != '' &&
      needs.reproducibility-compare.result == 'success'
    needs: [select-images, reproducibility-compare]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ghcr-production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-images.outputs.standard_matrix) }}
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: download digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-platform-digest-${{ matrix.image }}
          path: /tmp/verified-digest

      - name: download oci archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-oci-${{ matrix.image }}
          path: /tmp/audited

      # The record step below requires the pushed digest to equal the audited one.
      - name: unpack oci archive
        run: |
          mkdir -p /tmp/layout
          tar -xf /tmp/audited/${{ matrix.image }}-1.tar -C /tmp/layout

      - name: install crane
        run: |
          curl -fsSL -o /tmp/crane.tar.gz \
            https://github.com/google/go-containerregistry/releases/download/v0.21.6/go-containerregistry_Linux_x86_64.tar.gz
          echo "7ebbdcd05b652345c1f5105f8475e518534b90d66f3bdb50017be63f426ea435  /tmp/crane.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/crane.tar.gz -C /tmp crane
          sudo install -m 0755 /tmp/crane /usr/local/bin/crane

      - name: login ghcr
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push image
        id: push
        env:
          IMAGE_NAME: ghcr.io/confidential-dot-ai/confidential-inference/${{ matrix.image }}
        run: |
          crane push /tmp/layout "$IMAGE_NAME:sha-$GITHUB_SHA" --image-refs /tmp/refs.txt
          reference="$(tr -d '\n' < /tmp/refs.txt)"
          test "${reference%@*}" = "$IMAGE_NAME"
          printf 'digest=%s\n' "${reference#*@}" >> "$GITHUB_OUTPUT"

      - name: record image digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_NAME: ghcr.io/confidential-dot-ai/confidential-inference/${{ matrix.image }}
          BASE_REF: ${{ needs.select-images.outputs.base_ref }}
          BASE_REF_COMMIT: ${{ needs.select-images.outputs.base_ref_commit }}
        run: |
          scripts/check-image-build-output.sh "$IMAGE_DIGEST"
          python3 scripts/image-publication-manifest.py record \
            --image "$IMAGE_NAME" \
            --pushed-digest "$IMAGE_DIGEST" \
            --reproducibility-digest "$(tr -d '\n' < /tmp/verified-digest/${{ matrix.image }}.platform-digest)" \
            --source-commit "$GITHUB_SHA" \
            --base-ref "$BASE_REF" \
            --base-ref-commit "$BASE_REF_COMMIT" \
            --output /tmp/${{ matrix.image }}.publication.json
          printf "### %s\n\n\`%s@%s\`\n" "$IMAGE_NAME" "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: upload publication record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image-publication-record-${{ matrix.image }}
          path: /tmp/${{ matrix.image }}.publication.json
          if-no-files-found: error
          retention-days: 1

  # The sglang OCI archive (~20 GB) is too large to pass between jobs, so the
  # publish job builds it once more and pushes only a digest equal to the
  # audited one. No unaudited sglang bytes reach the registry.
  publish-sglang:
    name: publish sglang
    if: >-
      always() &&
      inputs.publish &&
      needs.select-images.result == 'success' &&
      needs.select-images.outputs.sglang == 'true' &&
      needs.reproducibility-sglang-compare.result == 'success'
    needs: [select-images, reproducibility-sglang-compare]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ghcr-production
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: get source epoch
        id: source
        run: printf 'epoch=%s\n' "$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      # The publish title comes from the image selector, as it does for the
      # standard images, so the workflow holds one SGLang title literal.
      - name: get image title
        id: title
        run: >-
          python3 -c 'import runpy; m = runpy.run_path("scripts/affected-release-images.py");
          print("title=" + next(i.title for i in m["IMAGES"] if i.image == "sglang"))'
          >> "$GITHUB_OUTPUT"

      - name: download digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-platform-digest-sglang
          path: /tmp/verified-digest

      - name: free disk space
        run: |
          echo "--- disk before cleanup ---"
          df -h / /mnt || true
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/local/julia* \
            /usr/local/lib/heroku /opt/az /usr/local/share/boost /usr/share/miniconda \
            2>/dev/null || true
          sudo apt-get clean
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile 2>/dev/null || true
          sudo service docker stop
          sudo mkdir -p /mnt/docker-data
          printf '{"data-root":"/mnt/docker-data"}\n' | sudo tee /etc/docker/daemon.json
          sudo rm -rf /var/lib/docker
          sudo service docker start
          echo "--- disk after cleanup ---"
          df -h / /mnt

      - name: setup buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: login ghcr
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: images/sglang
          file: images/sglang/Dockerfile
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          platforms: linux/amd64
          no-cache: true
          outputs: type=image,name=ghcr.io/confidential-dot-ai/confidential-inference/sglang:sha-${{ github.sha }},push=true,rewrite-timestamp=true
          labels: |
            org.opencontainers.image.title=${{ steps.title.outputs.title }}
            org.opencontainers.image.source=https://github.com/confidential-dot-ai/confidential-inference
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          # The pushed object must have the same digest as the deterministic
          # platform manifest. Extra attestations create a different index
          # digest, so release image provenance is the publication manifest.
          provenance: false
          sbom: false

      - name: record image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/confidential-dot-ai/confidential-inference/sglang
          BASE_REF: ${{ needs.select-images.outputs.base_ref }}
          BASE_REF_COMMIT: ${{ needs.select-images.outputs.base_ref_commit }}
        run: |
          scripts/check-image-build-output.sh "$IMAGE_DIGEST"
          python3 scripts/image-publication-manifest.py record \
            --image "$IMAGE_NAME" \
            --pushed-digest "$IMAGE_DIGEST" \
            --reproducibility-digest "$(tr -d '\n' < /tmp/verified-digest/sglang.platform-digest)" \
            --source-commit "$GITHUB_SHA" \
            --base-ref "$BASE_REF" \
            --base-ref-commit "$BASE_REF_COMMIT" \
            --output /tmp/sglang.publication.json
          printf "### %s\n\n\`%s@%s\`\n" "$IMAGE_NAME" "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: upload publication record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image-publication-record-sglang
          path: /tmp/sglang.publication.json
          if-no-files-found: error
          retention-days: 1

  # An unsigned branch build (single_build) pushes each selected image from
  # one clean build, with no audit. Its evidence records that digest as both
  # digests; it stays in the release-bundle.yml run that called this one.
  publish-single:
    if: inputs.single_build && needs.select-images.outputs.names != ''
    needs: select-images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ghcr-production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-images.outputs.matrix) }}
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: free disk space
        if: matrix.image == 'sglang'
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/local/julia* \
            /usr/local/lib/heroku /opt/az /usr/local/share/boost /usr/share/miniconda \
            2>/dev/null || true
          sudo apt-get clean
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile 2>/dev/null || true
          sudo service docker stop
          sudo mkdir -p /mnt/docker-data
          printf '{"data-root":"/mnt/docker-data"}\n' | sudo tee /etc/docker/daemon.json
          sudo rm -rf /var/lib/docker
          sudo service docker start
          df -h / /mnt

      - name: setup buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: login ghcr
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stamped with a content id of this image's inputs and a fixed epoch
      # (scripts/affected-release-images.py input_revision), not the build
      # commit: the same inputs give the same digest on any commit or branch,
      # so an upgrade rolls only changed images.
      - name: build and push image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            SOURCE_REVISION=${{ matrix.revision }}
            SOURCE_DATE_EPOCH=${{ matrix.epoch }}
          platforms: linux/amd64
          no-cache: true
          outputs: type=image,name=ghcr.io/confidential-dot-ai/confidential-inference/${{ matrix.image }}:sha-${{ github.sha }},push=true,rewrite-timestamp=true
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.source=https://github.com/confidential-dot-ai/confidential-inference
            org.opencontainers.image.revision=${{ matrix.revision }}
            org.opencontainers.image.version=sha-${{ matrix.revision }}
          provenance: false
          sbom: false

      - name: record image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/confidential-dot-ai/confidential-inference/${{ matrix.image }}
          BASE_REF: ${{ needs.select-images.outputs.base_ref }}
          BASE_REF_COMMIT: ${{ needs.select-images.outputs.base_ref_commit }}
        run: |
          scripts/check-image-build-output.sh "$IMAGE_DIGEST"
          python3 scripts/image-publication-manifest.py record \
            --image "$IMAGE_NAME" \
            --pushed-digest "$IMAGE_DIGEST" \
            --reproducibility-digest "$IMAGE_DIGEST" \
            --source-commit "$GITHUB_SHA" \
            --base-ref "$BASE_REF" \
            --base-ref-commit "$BASE_REF_COMMIT" \
            --output /tmp/${{ matrix.image }}.publication.json

      - name: save publication record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image-publication-record-${{ matrix.image }}
          path: /tmp/${{ matrix.image }}.publication.json
          if-no-files-found: error
          retention-days: 1

  # The evidence names the image source commit, so every release profile that
  # pins this commit uses the same artifact.
  publication-manifest:
    name: publication manifest
    if: >-
      always() &&
      needs.select-images.result == 'success' &&
      ((inputs.publish &&
        (needs.select-images.outputs.standard_names == '' || needs.publish-standard.result == 'success') &&
        (needs.select-images.outputs.sglang != 'true' || needs.publish-sglang.result == 'success')) ||
       (inputs.single_build && needs.select-images.outputs.names != '' && needs.publish-single.result == 'success'))
    needs: [select-images, publish-standard, publish-sglang, publish-single]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: download publication records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-image-publication-record-*
          path: /tmp/publication-records
          merge-multiple: true

      - name: build publication manifest
        env:
          SELECTED_IMAGES: ${{ needs.select-images.outputs.names }}
        run: |
          mkdir -p dist
          args=()
          IFS=, read -ra images <<< "$SELECTED_IMAGES"
          test "${#images[@]}" -gt 0
          for image in "${images[@]}"; do
            record="/tmp/publication-records/${image}.publication.json"
            test -f "$record"
            args+=(--record "$record" --expected-image "$image")
          done
          python3 scripts/image-publication-manifest.py merge "${args[@]}" \
            --output dist/image-publication-manifest.json

      - name: upload publication manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image-publication-${{ github.sha }}
          path: dist/image-publication-manifest.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
