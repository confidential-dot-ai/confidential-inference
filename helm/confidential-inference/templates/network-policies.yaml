{{- $pair := and .Values.inference.enabled (eq (.Values.inference.layout | default "worker") "pair") }}
# Start from denial. The following policies document the minimum v0 paths.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.c8s.frontDoorNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.c8s.frontDoorPodLabelName }}
      ports:
        - {protocol: TCP, port: {{ .Values.gateway.containerPorts.public }}}
    {{- if .Values.telemetry.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry-collector
      ports:
        - {protocol: TCP, port: {{ .Values.gateway.containerPorts.metrics }}}
    {{- end }}
---
# c8s injects certificate and secret clients into confidential workloads.
# They must reach the CDS before the main containers start.
# They must also reach the c8s mesh: ratls-mesh DNATs every TCP connection from
# one confidential workload to another, on this node or another, to
# nodeIP:15001 in PREROUTING, and the CNI applies this egress policy after the
# DNAT. Without that port every pod-to-pod connection is dropped before the
# mesh sees it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workloads-to-c8s-cds
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [gateway, sglang-router, inference-worker, inference-pair, pd-router, telemetry-collector, kube-state-metrics, node-log-agent]
  policyTypes: [Egress]
  egress:
    # The mesh listens on the node address, which Cilium classifies as a host
    # identity, not a CIDR peer, so this rule names no peer.
    - ports:
        - {protocol: TCP, port: 15001}
    # The injected credential clients (c8s-cert, c8s-secret, c8s-volume).
    {{- include "confidential-inference.cdsEgress" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-to-router
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes: [Egress]
  egress:
    # The admin: key snapshot pull and usage events. Also the gateway's
    # allowlist exit.
    - to:
        - ipBlock:
            cidr: {{ printf "%s/32" .Values.gateway.admin.address | quote }}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: sglang-router
      ports:
        - {protocol: TCP, port: {{ .Values.router.port }}}
    {{- range .Values.attestationReceipts.evidenceEgressCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - {protocol: TCP, port: 443}
    {{- end }}
    # The front-door evidence fetch (discovery/allowlist/attest-lb) targets the
    # c8s front door. Selectors, not ipBlock: Cilium evaluates egress ipBlock
    # against post-DNAT pod IPs, so a ClusterIP rule would not match.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.c8s.frontDoorNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.c8s.frontDoorPodLabelName }}
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: router-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: sglang-router
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - {protocol: TCP, port: {{ .Values.router.port }}}
    {{- if .Values.telemetry.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry-collector
      ports:
        - {protocol: TCP, port: {{ .Values.router.metricsPort }}}
    {{- end }}
  egress:
    {{- if $pair }}
    # inference.layout pair: the replicas' PD routers.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pd-router
      ports:
        - {protocol: TCP, port: {{ .Values.inference.pair.router.port }}}
    {{- else }}
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [inference-worker]
      ports:
        {{- if .Values.inference.enabled }}
        - {protocol: TCP, port: {{ .Values.inference.port }}}
        {{- end }}
    {{- end }}
    # Service discovery: the API server's own address (router.discovery).
    # C8s, not this policy, limits it to that one address, the router's
    # allowlist exit. The API server runs on a node, which Cilium classifies
    # as a host identity, not a CIDR peer, so the rule names only the port
    # (like the mesh port).
    - ports:
        - {protocol: TCP, port: {{ .Values.router.discovery.apiServer.port }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [inference-worker]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: sglang-router
      ports:
        {{- if .Values.inference.enabled }}
        - {protocol: TCP, port: {{ .Values.inference.port }}}
        {{- end }}
    {{- if and .Values.telemetry.enabled .Values.inference.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry-collector
      ports:
        - {protocol: TCP, port: {{ .Values.inference.port }}}
        - {protocol: TCP, port: {{ .Values.inference.metricsPort }}}
    {{- end }}
---
{{- if $pair }}
# Each PD router takes requests from the cache-aware router and sends them to
# the prefill and decode workers of its pair. Decode reaches prefill's KV
# bootstrap server on loopback inside the pair pod, so no policy opens it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pd-router-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: pd-router
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: sglang-router
      ports:
        - {protocol: TCP, port: {{ .Values.inference.pair.router.port }}}
    {{- if .Values.telemetry.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry-collector
      ports:
        - {protocol: TCP, port: {{ .Values.inference.pair.router.metricsPort }}}
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: inference-pair
      ports:
        - {protocol: TCP, port: {{ .Values.inference.pair.prefill.port }}}
        - {protocol: TCP, port: {{ .Values.inference.pair.decode.port }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pair-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: inference-pair
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pd-router
      ports:
        - {protocol: TCP, port: {{ .Values.inference.pair.prefill.port }}}
        - {protocol: TCP, port: {{ .Values.inference.pair.decode.port }}}
    {{- if .Values.telemetry.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry-collector
      ports:
        - {protocol: TCP, port: {{ .Values.inference.pair.prefill.port }}}
        - {protocol: TCP, port: {{ .Values.inference.pair.decode.port }}}
        - {protocol: TCP, port: {{ .Values.inference.metricsPort }}}
    {{- end }}
---
{{- end }}
{{- if .Values.telemetry.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telemetry-collector-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: telemetry-collector
  policyTypes: [Ingress, Egress]
  ingress:
    # The node log agents: logs and their own metrics, over OTLP/HTTP.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: node-log-agent
      ports:
        - {protocol: TCP, port: {{ .Values.telemetry.otlpHttpPort }}}
    {{- if .Values.telemetry.traces.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: inference-worker
      ports:
        - {protocol: TCP, port: {{ .Values.telemetry.otlpGrpcPort }}}
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [gateway, sglang-router, inference-worker]
      ports:
        - {protocol: TCP, port: {{ .Values.gateway.containerPorts.metrics }}}
        - {protocol: TCP, port: {{ .Values.router.metricsPort }}}
        {{- if .Values.inference.enabled }}
        - {protocol: TCP, port: {{ .Values.inference.port }}}
        - {protocol: TCP, port: {{ .Values.inference.metricsPort }}}
        {{- end }}
    {{- if $pair }}
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [inference-pair, pd-router]
      ports:
        - {protocol: TCP, port: {{ .Values.inference.pair.prefill.port }}}
        - {protocol: TCP, port: {{ .Values.inference.pair.decode.port }}}
        - {protocol: TCP, port: {{ .Values.inference.metricsPort }}}
        - {protocol: TCP, port: {{ .Values.inference.pair.router.metricsPort }}}
    {{- end }}
    # The relay: the one exit, also declared in the collector's allowlist entry.
    - to:
        - ipBlock: {cidr: {{ printf "%s/32" .Values.telemetry.relay.address | quote }} }
      ports:
        - {protocol: TCP, port: {{ .Values.telemetry.relay.port }}}
    {{- with .Values.telemetry.kubeStateMetrics.target }}
    # C8s's platform kube-state-metrics. C8s, not this policy, limits it to
    # the one address; a node address is a host identity to Cilium, not a
    # CIDR peer, so the rule names only the port (like the mesh port).
    - ports:
        - {protocol: TCP, port: {{ last (splitList ":" .) }}}
    {{- end }}
---
# The node log agent reaches only the telemetry collector (and, through the
# rules above, the mesh, DNS and its credential clients' CDS). It takes no
# connection.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-log-agent-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: node-log-agent
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry-collector
      ports:
        - {protocol: TCP, port: {{ .Values.telemetry.otlpHttpPort }}}
---
{{- if .Values.telemetry.traces.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workers-to-telemetry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: inference-worker
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry-collector
      ports:
        - {protocol: TCP, port: {{ .Values.telemetry.otlpGrpcPort }}}
---
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: kube-state-metrics
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: {{ .Values.kubeStateMetrics.kubeApiPort }}}
{{- if and .Values.inference.enabled .Values.inference.model.download.enabled }}
---
# fetch-model downloads the model from the pinned addresses of
# inference.model.download.hosts, which are also the workers' allowlist exits.
# The byte manifest pins every downloaded byte.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inference-worker-model-download
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [inference-worker, inference-pair]
  policyTypes: [Egress]
  egress:
    {{- $root := . }}
    {{- range $port := include "confidential-inference.modelDownloadPorts" . | fromJsonArray }}
    - to:
        {{- range $root.Values.inference.model.download.hosts }}
        {{- if eq (include "confidential-inference.modelDownloadHostPort" (dict "root" $root "host" .) | int) (int $port) }}
        - ipBlock: {cidr: {{ printf "%s/32" .address | quote }}}
        {{- end }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ int $port }}}
    {{- end }}
{{- end }}
{{- $seed := ((.Values.inference.pair | default dict).kernelCache | default dict).seed | default dict }}
{{- if and .Values.inference.enabled (eq (.Values.inference.layout | default "worker") "pair") $seed.enabled $seed.hosts }}
---
# fetch-model fills the pair's kernel cache from the pinned addresses of
# inference.pair.kernelCache.seed.hosts, which are also the pair's allowlist
# exits. The seed manifest pins every byte.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inference-pair-kernel-cache-seed
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: inference-pair
  policyTypes: [Egress]
  egress:
    {{- range $seed.hosts }}
    {{- $scheme := .scheme | default "https" }}
    - to:
        - ipBlock: {cidr: {{ printf "%s/32" .address | quote }}}
      ports:
        - {protocol: TCP, port: {{ gt (int (.port | default 0)) 0 | ternary (int .port) (eq $scheme "http" | ternary 80 443) }}}
    {{- end }}
{{- end }}
