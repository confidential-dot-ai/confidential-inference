# Start from denial. The following policies document the minimum v0 paths.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.c8s.frontDoorNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.c8s.frontDoorPodLabelName }}
      ports:
        - {protocol: TCP, port: {{ .Values.gateway.containerPorts.public }}}
    {{- if .Values.telemetry.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry-collector
      ports:
        - {protocol: TCP, port: {{ .Values.gateway.containerPorts.metrics }}}
    {{- end }}
---
# c8s injects certificate and secret clients into confidential workloads.
# They must reach the c8s certificate service before the main containers start.
# They must also reach the c8s mesh: ratls-mesh DNATs every TCP connection from
# one confidential workload to another, on this node or another, to
# nodeIP:15001 in PREROUTING, and the CNI applies this egress policy after the
# DNAT. Without that port every pod-to-pod connection is dropped before the
# mesh sees it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workloads-to-c8s-cds
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [gateway, sglang-router, inference-worker, telemetry-collector, kube-state-metrics]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: c8s-system
      ports:
        - {protocol: TCP, port: 8443}
    # CDS verifies the requesting CVM through that CVM's local attestation API.
    # Cilium classifies node addresses as host identities, not CIDR peers.
    - ports:
        - {protocol: TCP, port: {{ .Values.attestationReceipts.attestationApiPort }}}
    # The mesh listens on the node address, which Cilium also classifies as a
    # host identity, so this rule names no peer either.
    - ports:
        - {protocol: TCP, port: 15001}
    # c8s >= v0.66 (C8s #806): the node hands its injected credential clients
    # (c8s-cert, c8s-secret, c8s-volume) the CDS NodePort on the address the
    # target launched with, outside the inner cluster. The node's pod ruleset
    # admits only that endpoint, so this rule names no peer.
    - ports:
        - {protocol: TCP, port: 30808}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-to-router
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes: [Egress]
  egress:
    {{- if .Values.gateway.usage.enabled }}
    {{- range .Values.gateway.usage.destinationCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - {protocol: TCP, port: {{ $.Values.gateway.usage.destinationPort }}}
    {{- end }}
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: sglang-router
      ports:
        - {protocol: TCP, port: {{ .Values.router.port }}}
    {{- if .Values.telemetry.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry-collector
      ports:
        - {protocol: TCP, port: {{ .Values.telemetry.otlpHttpPort }}}
    {{- end }}
    {{- range .Values.attestationReceipts.evidenceEgressCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - {protocol: TCP, port: 443}
    {{- end }}
    # The front-door evidence fetch (discovery/allowlist/attest-lb) targets the
    # c8s front door. Selectors, not ipBlock: Cilium evaluates egress ipBlock
    # against post-DNAT pod IPs, so a ClusterIP rule would not match.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.c8s.frontDoorNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.c8s.frontDoorPodLabelName }}
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: router-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: sglang-router
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - {protocol: TCP, port: {{ .Values.router.port }}}
    {{- if .Values.telemetry.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry-collector
      ports:
        - {protocol: TCP, port: {{ .Values.router.metricsPort }}}
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [inference-worker]
      ports:
        {{- if .Values.inference.enabled }}
        - {protocol: TCP, port: {{ .Values.inference.port }}}
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [inference-worker]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: sglang-router
      ports:
        {{- if .Values.inference.enabled }}
        - {protocol: TCP, port: {{ .Values.inference.port }}}
        {{- end }}
    {{- if and .Values.telemetry.enabled .Values.inference.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry-collector
      ports:
        - {protocol: TCP, port: {{ .Values.inference.port }}}
        - {protocol: TCP, port: {{ .Values.inference.metricsPort }}}
    {{- end }}
---
{{- if .Values.telemetry.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telemetry-collector-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: telemetry-collector
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - {protocol: TCP, port: {{ .Values.telemetry.otlpHttpPort }}}
    {{- if .Values.telemetry.traces.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: inference-worker
      ports:
        - {protocol: TCP, port: {{ .Values.telemetry.otlpGrpcPort }}}
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [gateway, sglang-router, inference-worker]
      ports:
        - {protocol: TCP, port: {{ .Values.gateway.containerPorts.metrics }}}
        - {protocol: TCP, port: {{ .Values.router.metricsPort }}}
        {{- if .Values.inference.enabled }}
        - {protocol: TCP, port: {{ .Values.inference.port }}}
        - {protocol: TCP, port: {{ .Values.inference.metricsPort }}}
        {{- end }}
    # The relay: the one exit, also declared in the collector's allowlist entry.
    - to:
        - ipBlock: {cidr: {{ printf "%s/32" .Values.telemetry.relay.address | quote }} }
      ports:
        - {protocol: TCP, port: {{ .Values.telemetry.relay.port }}}
    {{- with .Values.telemetry.kubeStateMetrics }}
    {{- if .enabled }}
    # C8s's platform kube-state-metrics (not an allowlist exit: C8s grants it).
    {{- $ksm := splitList ":" .address }}
    - to:
        - ipBlock: {cidr: {{ printf "%s/32" (first $ksm) | quote }} }
      ports:
        - {protocol: TCP, port: {{ last $ksm }}}
    {{- end }}
    {{- end }}
---
{{- if .Values.telemetry.traces.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workers-to-telemetry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: inference-worker
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry-collector
      ports:
        - {protocol: TCP, port: {{ .Values.telemetry.otlpGrpcPort }}}
---
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: kube-state-metrics
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: {{ .Values.kubeStateMetrics.kubeApiPort }}}
