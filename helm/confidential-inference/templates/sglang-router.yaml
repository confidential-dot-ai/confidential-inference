{{- define "confidential-inference.source.sglang-router" -}}
{{- if .Values.router.enabled }}
{{- $pd := and .Values.inference.enabled .Values.inference.pd.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: sglang-router
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
    app.kubernetes.io/component: sglang-router
spec:
  type: ClusterIP
  selector:
    {{- include "confidential-inference.selector" (dict "root" . "component" "sglang-router") | nindent 4 }}
  ports:
    - name: openai
      port: {{ .Values.router.port }}
      targetPort: openai
---
# The gateway's router address. The name does not change between releases,
# so an upgrade rolls the router behind it without a gap.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "confidential-inference.routerService" . }}
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
    app.kubernetes.io/component: sglang-router
spec:
  clusterIP: None
  selector:
    {{- include "confidential-inference.selector" (dict "root" . "component" "sglang-router") | nindent 4 }}
  ports:
    - name: openai
      port: {{ .Values.router.port }}
      targetPort: {{ .Values.router.port }}
    - name: metrics
      port: {{ .Values.router.metricsPort }}
      targetPort: {{ .Values.router.metricsPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-router
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
    app.kubernetes.io/component: sglang-router
spec:
  replicas: {{ .Values.router.replicas }}
  # Keep the ready router in service until its replacement can reach a worker.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "confidential-inference.selector" (dict "root" . "component" "sglang-router") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "confidential-inference.selector" (dict "root" . "component" "sglang-router") | nindent 8 }}
        confidential.ai/environment: {{ .Values.environment | quote }}
      annotations:
        confidential.ai/cw: sglang-router
        # The router reads its model routes once at start.
        checksum/config: {{ include "confidential-inference.modelRoutes" . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.router.metricsPort | quote }}
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.scheduling.routerNodeName | default .Values.scheduling.inferenceNodeName | quote }}
      # The router watches Ready worker Pods in this namespace.
      enableServiceLinks: false
      # A fixed hostname keeps HOSTNAME exact in the c8s allowlist.
      hostname: sglang-router
      serviceAccountName: sglang-router
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sglang-router
          image: {{ default .Values.images.sglang .Values.images.sglangRouter }}
          imagePullPolicy: IfNotPresent
          # The same non-root user as the workers, which run this image under
          # the restricted Pod Security level the c8s node enforces.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop: ["ALL"]
          command: ["python3", "-m", "sglang_router.launch_router"]
          args:
            {{- if $pd }}
            # Prefill/decode mode (inference.pd): each prefill URL and its
            # KV bootstrap port, each decode URL, then inference.pd.routerArgs.
            - --pd-disaggregation
            {{- range $w := .Values.inference.pd.workers }}
            {{- if eq $w.role "prefill" }}
            - --prefill
            - {{ include "confidential-inference.pdWorkerUrl" $w }}
            - {{ $w.bootstrapPort | quote }}
            {{- end }}
            {{- end }}
            {{- range $w := .Values.inference.pd.workers }}
            {{- if eq $w.role "decode" }}
            - --decode
            - {{ include "confidential-inference.pdWorkerUrl" $w }}
            {{- end }}
            {{- end }}
            {{- range .Values.inference.pd.routerArgs }}
            - {{ toJson . }}
            {{- end }}
            - --host=0.0.0.0
            - --port={{ .Values.router.port }}
            - --prometheus-host=0.0.0.0
            - --prometheus-port={{ .Values.router.metricsPort }}
            {{- else }}
            # c8s >= v0.64: a mesh member pod cannot reach the Kubernetes API,
            # so the router gets its workers by name instead of by discovery.
            - --worker-urls
            {{- range $index := until (int .Values.inference.replicas) }}
            - http://inference-worker-{{ $index }}-0.inference-workers:{{ $.Values.inference.port }}
            {{- end }}
            - --policy=cache_aware
            - --cache-threshold=0.3
            - --balance-abs-threshold=64
            - --balance-rel-threshold=1.5
            - --eviction-interval-secs=60
            - --max-tree-size=67108864
            - --health-check-endpoint=/health
            # A worker that gets SIGTERM answers /health with 503 and drains
            # (upstream SGLang). The router stops picking it within one 2 s
            # health check. A request that fails on it in that window opens
            # its circuit after 2 failures, and the router's retries (5 by
            # default) go to another worker. A dead pod IP fails in 2 s, not
            # the default 10 s connect timeout.
            - --health-check-interval-secs=2
            - --health-check-timeout-secs=2
            - --health-failure-threshold=1
            - --cb-failure-threshold=2
            - --cb-timeout-duration-secs=10
            - --connect-timeout-secs=2
            {{- if .Values.inference.enabled }}
            # Production workers can need more than 30 minutes to load and tune the model.
            - --worker-startup-timeout-secs=3600
            {{- end }}
            - --host=0.0.0.0
            - --port={{ .Values.router.port }}
            - --prometheus-host=0.0.0.0
            - --prometheus-port={{ .Values.router.metricsPort }}
            {{- end }}
          env:
            - name: CI_ROUTER_MODEL_ROUTES_FILE
              value: /mnt/c8s-data/model-routes/routes.json
          volumeMounts:
            - name: model-routes
              mountPath: /mnt/c8s-data/model-routes
              readOnly: true
          ports:
            - name: openai
              containerPort: {{ .Values.router.port }}
            - name: metrics
              containerPort: {{ .Values.router.metricsPort }}
          resources:
            requests:
              cpu: {{ .Values.router.resources.cpu | quote }}
              memory: {{ .Values.router.resources.memory }}
          # c8s v0.33 seals exec, so the kubelet probes over HTTP.
          readinessProbe:
            httpGet:
              path: /readiness
              port: openai
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: openai
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: model-routes
          configMap:
            name: {{ .Values.runtimeConfig.routerConfigMap }}
{{- end }}

{{- end -}}
{{- include "confidential-inference.applyWorkloadOverrides" (dict "root" . "body" (include "confidential-inference.source.sglang-router" .)) }}
