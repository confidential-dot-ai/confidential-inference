{{- define "confidential-inference.source.gateway" -}}
{{- if le (int .Values.gateway.terminationGracePeriodSeconds) (add (int .Values.gateway.shutdownGraceSeconds) (int .Values.gateway.endpointDrainSeconds)) }}
{{- fail "gateway.terminationGracePeriodSeconds must exceed gateway.shutdownGraceSeconds plus gateway.endpointDrainSeconds" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-release-identity
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  {{- $identity := dict }}
  {{- if not .Values.runtimeConfig.enabled }}
  {{- $_ := set $identity "releaseBundleSha256" .Values.attestationReceipts.releaseBundleSha256 }}
  {{- end }}
  {{- if eq .Values.attestationReceipts.policyMode "operator" }}
  {{- $_ := set $identity "expectedOperatorPublicKeySha256" .Values.attestationReceipts.expectedOperatorPublicKeySha256 }}
  {{- $_ := set $identity "expectedOperatorKeySetSha256" .Values.attestationReceipts.expectedOperatorKeySetSha256 }}
  {{- end }}
  {{- $cds := .Values.attestationReceipts.cds }}
  {{- if and (or $cds.imagePolicy $cds.servedImagePolicy) (not (and $cds.imagePolicy $cds.servedImagePolicy $cds.url)) }}
  {{- fail "attestationReceipts.cds needs url, imagePolicy and servedImagePolicy together" }}
  {{- end }}
  {{- if $cds.imagePolicy }}
  {{- /* The deployment supplies the two c8s image policies; their pins travel
         in this file, not the environment (services/gateway/ATTESTATION.md,
         "CDS verification"). */}}
  {{- $_ := set $identity "cdsImagePolicySha256" (printf "sha256:%s" (sha256sum $cds.imagePolicy)) }}
  {{- $_ := set $identity "cdsServedImagePolicySha256" (printf "sha256:%s" (sha256sum $cds.servedImagePolicy)) }}
  cds-image-policy.json: {{ toJson $cds.imagePolicy }}
  served-image-policy.json: {{ toJson $cds.servedImagePolicy }}
  {{- end }}
  release-identity.json: {{ toJson $identity | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "confidential-inference.selector" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.publicPort }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  # Keep the ready gateway in service until its replacement passes
  # readiness, which waits for the first key snapshot from the admin.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "confidential-inference.selector" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "confidential-inference.selector" (dict "root" . "component" "gateway") | nindent 8 }}
        confidential.ai/environment: {{ .Values.environment | quote }}
      annotations:
        confidential.ai/cw: gateway
        confidential.ai/c8s-renew-interval: {{ .Values.attestationReceipts.certificateRenewInterval | quote }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.gateway.containerPorts.metrics | quote }}
        # c8s releases the pepper and the admin client configuration only
        # after workload attestation, into the c8s memory-backed secret
        # directory. They never enter a Kubernetes Secret, ConfigMap, image,
        # or volume.
        {{- $secrets := .Values.gateway.c8sSecrets }}
        confidential.ai/c8s-secrets: {{ printf "%s=%s,%s=%s" $secrets.apiKeyPepper.name $secrets.apiKeyPepper.sourcePath $secrets.adminConfig.name $secrets.adminConfig.sourcePath | quote }}
        confidential.ai/c8s-secret-dir: /run/c8s/secrets
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.scheduling.gatewayNodeName | quote }}
      enableServiceLinks: false
      # A fixed hostname keeps HOSTNAME exact in the c8s allowlist.
      hostname: gateway
      serviceAccountName: confidential-inference
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds }}
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [65532]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ .Values.images.gateway }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          env:
            - name: GATEWAY_LISTEN
              value: 0.0.0.0:{{ .Values.gateway.containerPorts.public }}
            - name: GATEWAY_METRICS_LISTEN
              value: 0.0.0.0:{{ .Values.gateway.containerPorts.metrics }}
            - name: GATEWAY_INFERENCE_URL
              value: http://sglang-router:{{ .Values.router.port }}
            - name: GATEWAY_ALLOW_DIRECT_INFERENCE_URL
              value: "true"
            - name: GATEWAY_MAXIMUM_HEADERS
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.maximumHeaders) | quote }}
            - name: GATEWAY_MAXIMUM_HEADER_BYTES
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.maximumHeaderBytes) | quote }}
            - name: GATEWAY_MAXIMUM_URI_BYTES
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.maximumUriBytes) | quote }}
            {{- if not .Values.runtimeConfig.enabled }}
            - name: GATEWAY_MAXIMUM_BODY_BYTES
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.maximumBodyBytes) | quote }}
            {{- end }}
            - name: GATEWAY_HEADER_TIMEOUT_SECONDS
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.headerTimeoutSeconds) | quote }}
            {{- if not .Values.runtimeConfig.enabled }}
            - name: GATEWAY_BODY_TIMEOUT_SECONDS
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.bodyTimeoutSeconds) | quote }}
            - name: GATEWAY_UPSTREAM_TIMEOUT_SECONDS
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.upstreamTimeoutSeconds) | quote }}
            - name: GATEWAY_STREAM_IDLE_TIMEOUT_SECONDS
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.streamIdleTimeoutSeconds) | quote }}
            - name: GATEWAY_GLOBAL_REQUEST_CONCURRENCY
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.globalRequestConcurrency) | quote }}
            - name: GATEWAY_PER_ADDRESS_CONCURRENCY
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.perAddressConcurrency) | quote }}
            - name: GATEWAY_INFERENCE_CONCURRENCY
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.inferenceConcurrency) | quote }}
            - name: GATEWAY_INFERENCE_QUEUE
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.inferenceQueue) | quote }}
            - name: GATEWAY_QUEUE_TIMEOUT_SECONDS
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.queueTimeoutSeconds) | quote }}
            - name: GATEWAY_PER_KEY_CONCURRENCY
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.perKeyConcurrency) | quote }}
            - name: GATEWAY_ATTESTATION_CONCURRENCY
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.attestationConcurrency) | quote }}
            - name: GATEWAY_REQUESTS_PER_ADDRESS_PER_SECOND
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.requestsPerAddressPerSecond) | quote }}
            {{- end }}
            - name: GATEWAY_SHUTDOWN_GRACE_SECONDS
              value: {{ printf "%.0f" (float64 .Values.gateway.shutdownGraceSeconds) | quote }}
            - name: GATEWAY_ENDPOINT_DRAIN_SECONDS
              value: {{ printf "%.0f" (float64 .Values.gateway.endpointDrainSeconds) | quote }}
            {{- if .Values.gateway.protection.trustedProxyCidrs }}
            - name: GATEWAY_TRUSTED_PROXY_CIDRS
              value: {{ join "," .Values.gateway.protection.trustedProxyCidrs | quote }}
            {{- end }}
            {{- if .Values.runtimeConfig.enabled }}
            - name: GATEWAY_ROUTER_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: GATEWAY_RUNTIME_CONFIG_FILE
              value: /mnt/c8s-data/runtime/settings.json
            - name: GATEWAY_RELEASE_SELECTION_FILE
              value: /mnt/c8s-data/release-selection/releases.json
            {{- else }}
            - name: GATEWAY_MODEL
              value: {{ .Values.inference.model.name | quote }}
            {{- end }}
            {{- if not .Values.runtimeConfig.enabled }}
            - name: GATEWAY_C8S_EVIDENCE_BASE_URL
              value: {{ .Values.attestationReceipts.evidenceBaseUrl | quote }}
            {{- with .Values.attestationReceipts.evidenceConnectHost }}
            - name: GATEWAY_C8S_EVIDENCE_CONNECT_HOST
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if not .Values.runtimeConfig.enabled }}
            - name: GATEWAY_RELEASE_ID
              value: {{ .Values.attestationReceipts.releaseId | quote }}
            {{- end }}
            # The release manifest hash and the operator key hashes are in a
            # mounted file, so the exact allowlist does not pin them.
            # The bounded reader accepts kubelet's symlink only inside the mount.
            - name: GATEWAY_RELEASE_IDENTITY_FILE
              value: /mnt/c8s-data/release-identity/..data/release-identity.json
            {{- with .Values.attestationReceipts.cds.url }}
            # The CDS origin and the policy file paths are release constants;
            # the pins are in the release identity file.
            - name: GATEWAY_C8S_CDS_URL
              value: {{ . | quote }}
            - name: GATEWAY_C8S_IMAGE_POLICY
              value: /mnt/c8s-data/release-identity/..data/cds-image-policy.json
            - name: GATEWAY_C8S_SERVED_IMAGE_POLICY
              value: /mnt/c8s-data/release-identity/..data/served-image-policy.json
            {{- end }}
            - name: GATEWAY_ADMIN_CONFIG_FILE
              value: {{ printf "/run/c8s/secrets/%s" .Values.gateway.c8sSecrets.adminConfig.name | quote }}
            {{- if .Values.gateway.usage.enabled }}
            - name: GATEWAY_USAGE_ENABLED
              value: "true"
            {{- end }}
            - name: GATEWAY_API_KEY_PEPPER_FILE
              value: {{ printf "/run/c8s/secrets/%s" .Values.gateway.c8sSecrets.apiKeyPepper.name | quote }}
            - name: GATEWAY_ADMIN_SIGNER_CERTIFICATE_FILE
              value: /mnt/c8s-data/admin-auth/..data/client.crt
            - name: GATEWAY_ADMIN_API_KEY_HASHES_FILE
              value: /mnt/c8s-data/admin-api-key/..data/sha256
            - name: DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: GATEWAY_METRICS_API_KEY_LABEL_ALLOWLIST
              value: {{ join "," .Values.metricsCollector.approvedApiKeyLabels | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.containerPorts.public }}
            - name: metrics
              containerPort: {{ .Values.gateway.containerPorts.metrics }}
          resources:
            requests:
              cpu: {{ .Values.gateway.resources.cpu | quote }}
              memory: {{ .Values.gateway.resources.memory }}
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            # Directory mounts, not subPath: the node image policy cannot
            # establish the storage of a kubelet subPath bind, so an exact
            # mount rule on one never admits. The files keep their paths.
            - name: admin-auth
              mountPath: /mnt/c8s-data/admin-auth
              readOnly: true
            - name: admin-api-key
              mountPath: /mnt/c8s-data/admin-api-key
              readOnly: true
            - name: release-identity
              mountPath: /mnt/c8s-data/release-identity
              readOnly: true
            {{- if .Values.runtimeConfig.enabled }}
            - name: runtime-config
              mountPath: /mnt/c8s-data/runtime
              readOnly: true
            - name: release-selection
              mountPath: /mnt/c8s-data/release-selection
              readOnly: true
            {{- end }}
            - name: run
              mountPath: /run/confidential-gateway
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: admin-auth
          secret:
            secretName: {{ .Values.gateway.secrets.adminSigner.secretName }}
            items:
              - key: {{ .Values.gateway.secrets.adminSigner.certificateKey }}
                path: client.crt
        # Optional until the admin cutover (#186): without it the gateway
        # accepts only the v1 admin signature.
        - name: admin-api-key
          secret:
            secretName: {{ .Values.gateway.secrets.adminApiKey.secretName }}
            optional: true
            items:
              - key: sha256
                path: sha256
        - name: release-identity
          configMap:
            name: gateway-release-identity
        {{- if .Values.runtimeConfig.enabled }}
        - name: runtime-config
          configMap:
            name: {{ .Values.runtimeConfig.gatewayConfigMap }}
        - name: release-selection
          configMap:
            name: {{ .Values.runtimeConfig.releaseConfigMap }}
        {{- end }}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}

{{- end -}}
{{- include "confidential-inference.applyWorkloadOverrides" (dict "root" . "body" (include "confidential-inference.source.gateway" .)) }}
