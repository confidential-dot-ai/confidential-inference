{{- define "confidential-inference.source.gateway" -}}
{{- if le (int .Values.gateway.terminationGracePeriodSeconds) (add (int .Values.gateway.shutdownGraceSeconds) (int .Values.gateway.endpointDrainSeconds)) }}
{{- fail "gateway.terminationGracePeriodSeconds must exceed gateway.shutdownGraceSeconds plus gateway.endpointDrainSeconds" }}
{{- end }}
{{- $protection := .Values.gateway.protection }}
{{- if gt (int64 $protection.firstTokenTimeoutSeconds) (int64 $protection.upstreamTimeoutSeconds) }}
{{- fail "gateway.protection.firstTokenTimeoutSeconds must not exceed gateway.protection.upstreamTimeoutSeconds" }}
{{- end }}
{{- /* services/gateway/src/request_body.rs minimum_budget: one request of the largest body. */}}
{{- if lt (int64 $protection.bodyMemoryBytes) (add (mul 5 (int64 $protection.maximumBodyBytes)) 65536) }}
{{- fail "gateway.protection.bodyMemoryBytes must be at least 5 x maximumBodyBytes + 65536: the gateway refuses to start below it" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "confidential-inference.selector" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.publicPort }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  # Keep the ready gateway in service until its replacement passes
  # readiness.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "confidential-inference.selector" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "confidential-inference.selector" (dict "root" . "component" "gateway") | nindent 8 }}
        confidential.ai/environment: {{ .Values.environment | quote }}
      annotations:
        confidential.ai/cw: gateway
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.gateway.containerPorts.metrics | quote }}
        # CDS generates the gateway's secret on the first ask and releases it
        # only after workload attestation, into the c8s memory-backed secret
        # directory. It never enters a Kubernetes Secret, ConfigMap, image,
        # or volume. The usage reporter key and the log pseudonyms are
        # derived from it.
        {{- $secret := .Values.gateway.c8sSecrets.gateway }}
        confidential.ai/c8s-secrets: {{ printf "%s=%s" $secret.name $secret.sourcePath | quote }}
        confidential.ai/c8s-secret-dir: /run/c8s/secrets
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.scheduling.gatewayNodeName | quote }}
      # Each address is also one of the gateway's allowlist exits (C8s
      # #1047), so no DNS answer can move where keys and usage go.
      hostAliases:
        {{- range $address, $hosts := include "confidential-inference.gatewayExits" . | fromYaml }}
        - ip: {{ $address | quote }}
          hostnames: {{ $hosts | toJson }}
        {{- end }}
      enableServiceLinks: false
      # A fixed hostname keeps HOSTNAME exact in the c8s allowlist.
      hostname: gateway
      serviceAccountName: confidential-inference
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds }}
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [65532]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ .Values.images.gateway }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          env:
            # The framework release, pinned exactly in the live allowlist.
            - name: CI_FRAMEWORK_RELEASE
              value: {{ .Values.frameworkRelease.name | quote }}
            - name: CI_FRAMEWORK_RELEASE_BUNDLE_SHA256
              value: {{ .Values.frameworkRelease.bundleSha256 | quote }}
            - name: GATEWAY_LISTEN
              value: 0.0.0.0:{{ .Values.gateway.containerPorts.public }}
            - name: GATEWAY_METRICS_LISTEN
              value: 0.0.0.0:{{ .Values.gateway.containerPorts.metrics }}
            - name: GATEWAY_INFERENCE_URL
              value: http://sglang-router:{{ .Values.router.port }}
            - name: GATEWAY_ALLOW_DIRECT_INFERENCE_URL
              value: "true"
            - name: GATEWAY_MAXIMUM_HEADERS
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.maximumHeaders) | quote }}
            - name: GATEWAY_MAXIMUM_HEADER_BYTES
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.maximumHeaderBytes) | quote }}
            - name: GATEWAY_MAXIMUM_URI_BYTES
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.maximumUriBytes) | quote }}
            - name: GATEWAY_HEADER_TIMEOUT_SECONDS
              value: {{ printf "%.0f" (float64 .Values.gateway.protection.headerTimeoutSeconds) | quote }}
            - name: GATEWAY_SHUTDOWN_GRACE_SECONDS
              value: {{ printf "%.0f" (float64 .Values.gateway.shutdownGraceSeconds) | quote }}
            - name: GATEWAY_ENDPOINT_DRAIN_SECONDS
              value: {{ printf "%.0f" (float64 .Values.gateway.endpointDrainSeconds) | quote }}
            {{- if .Values.gateway.protection.trustedProxyCidrs }}
            - name: GATEWAY_TRUSTED_PROXY_CIDRS
              value: {{ join "," .Values.gateway.protection.trustedProxyCidrs | quote }}
            {{- end }}
            - name: GATEWAY_ROUTER_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            # The settings are environment, so the exact allowlist pins them.
            - name: GATEWAY_RUNTIME_CONFIG
              value: {{ include "confidential-inference.gatewaySettings" . | quote }}
            - name: GATEWAY_SECRET_FILE
              value: {{ printf "/run/c8s/secrets/%s" .Values.gateway.c8sSecrets.gateway.name | quote }}
            # Where keys are checked and usage goes: pinned in the allowlist
            # with the rest of the environment.
            - name: GATEWAY_CLOUD_ORIGIN
              value: {{ .Values.gateway.cloud.origin | quote }}
            {{- if .Values.gateway.usage.enabled }}
            - name: GATEWAY_USAGE_ENABLED
              value: "true"
            - name: GATEWAY_USAGE_ORIGIN
              value: {{ .Values.gateway.usage.origin | quote }}
            - name: GATEWAY_USAGE_LOCATION
              value: {{ required "gateway.usage.location is required with gateway.usage.enabled" .Values.gateway.usage.location | quote }}
            - name: GATEWAY_USAGE_MODELS
              value: {{ toJson .Values.gateway.usage.models | quote }}
            {{- end }}
            - name: DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.environment | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.containerPorts.public }}
            - name: metrics
              containerPort: {{ .Values.gateway.containerPorts.metrics }}
          resources:
            requests:
              cpu: {{ .Values.gateway.resources.cpu | quote }}
              memory: {{ .Values.gateway.resources.memory }}
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: run
              mountPath: /run/confidential-gateway
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}

{{- end -}}
{{- include "confidential-inference.applyWorkloadOverrides" (dict "root" . "body" (include "confidential-inference.source.gateway" .)) }}
