apiVersion: v1
kind: ServiceAccount
metadata:
  name: confidential-inference
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.imagePullSecret.name }}
imagePullSecrets:
  - name: {{ .Values.imagePullSecret.name }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sglang-router
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.imagePullSecret.name }}
imagePullSecrets:
  - name: {{ .Values.imagePullSecret.name }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- if .Values.imagePullSecret.name }}
imagePullSecrets:
  - name: {{ .Values.imagePullSecret.name }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: {{ .Release.Namespace }}
