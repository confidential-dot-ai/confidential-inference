apiVersion: v1
kind: ServiceAccount
metadata:
  name: confidential-inference
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.imagePullSecret.name }}
imagePullSecrets:
  - name: {{ .Values.imagePullSecret.name }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sglang-router
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.imagePullSecret.name }}
imagePullSecrets:
  - name: {{ .Values.imagePullSecret.name }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-collector
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- if .Values.imagePullSecret.name }}
imagePullSecrets:
  - name: {{ .Values.imagePullSecret.name }}
{{- end }}
---
# c8s v0.33 lets the operator create namespaced RBAC only. Prometheus
# discovers pods in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-metrics-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-metrics-reader
subjects:
  - kind: ServiceAccount
    name: metrics-collector
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- if .Values.imagePullSecret.name }}
imagePullSecrets:
  - name: {{ .Values.imagePullSecret.name }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: {{ .Release.Namespace }}
{{- if .Values.logCollector.enabled }}
---
# The log collector is an additional workload of the release profile. It reads
# the logs of the pods in the release namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-collector
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- if .Values.imagePullSecret.name }}
imagePullSecrets:
  - name: {{ .Values.imagePullSecret.name }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-log-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-log-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-log-reader
subjects:
  - kind: ServiceAccount
    name: log-collector
    namespace: {{ .Release.Namespace }}
{{- end }}
