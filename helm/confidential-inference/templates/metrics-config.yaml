{{- if .Values.metricsCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-collector
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      external_labels:
        environment: {{ .Values.environment | quote }}
        {{- if and .Values.telemetry.enabled .Values.telemetry.deployment }}
        deployment: {{ .Values.telemetry.deployment | quote }}
        {{- end }}
    {{- with .Values.telemetry }}
    {{- if .enabled }}
    remote_write:
      - url: {{ .metricsUrl | quote }}
        follow_redirects: false
        enable_http2: true
        tls_config:
          min_version: TLS12
          {{- if eq .auth.type "mtls" }}
          cert_file: /mnt/c8s-data/telemetry-auth/tls.crt
          key_file: /mnt/c8s-data/telemetry-auth/tls.key
          {{- end }}
        {{- if eq .auth.type "basic" }}
        basic_auth:
          username: {{ .auth.username | quote }}
          password_file: /mnt/c8s-data/telemetry-auth/password
        {{- else if eq .auth.type "oauth2" }}
        oauth2:
          client_id: {{ .auth.clientId | quote }}
          client_secret_file: /mnt/c8s-data/telemetry-auth/client-secret
          token_url: {{ .auth.tokenUrl | quote }}
          {{- with .auth.scopes }}
          scopes: {{ toJson . }}
          {{- end }}
        {{- end }}
        queue_config:
          capacity: {{ $.Values.metricsCollector.queue.capacity }}
          max_shards: {{ $.Values.metricsCollector.queue.maxShards }}
          max_samples_per_send: {{ $.Values.metricsCollector.queue.maxSamplesPerSend }}
          sample_age_limit: {{ $.Values.metricsCollector.queue.sampleAgeLimit | quote }}
    {{- end }}
    {{- end }}
    scrape_configs:
      - job_name: gateway
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: gateway
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:{{ .Values.gateway.containerPorts.metrics }}
          - target_label: component
            replacement: gateway
        metric_relabel_configs:
          - source_labels: [api_key_name]
            action: keep
            regex: {{ printf "^(|%s)$" (join "|" .Values.metricsCollector.approvedApiKeyLabels) | quote }}
          - source_labels: [api_key_tag]
            action: keep
            regex: {{ printf "^(|%s)$" (join "|" .Values.metricsCollector.approvedApiKeyLabels) | quote }}
          - action: labeldrop
            regex: "^(authorization|api_key|api_key_id|api_key_hash|api_key_value|prompt|response)$"
      - job_name: sglang-router
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: sglang-router
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:{{ .Values.router.metricsPort }}
          - target_label: component
            replacement: sglang-router
        metric_relabel_configs:
          - action: labeldrop
            regex: "^(api_key.*|authorization|prompt.*|response.*)$"
      {{- if .Values.inference.enabled }}
      - job_name: inference-worker-0
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: inference-worker
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            action: keep
            regex: inference-worker-0
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:{{ .Values.inference.port }}
          - target_label: replica
            replacement: inference-worker-0
          - target_label: component
            replacement: inference-worker
        metric_relabel_configs:
          - action: labeldrop
            regex: "^(api_key.*|authorization|prompt.*|response.*)$"
      - job_name: inference-worker-1
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: inference-worker
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            action: keep
            regex: inference-worker-1
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:{{ .Values.inference.port }}
          - target_label: replica
            replacement: inference-worker-1
          - target_label: component
            replacement: inference-worker
        metric_relabel_configs:
          - action: labeldrop
            regex: "^(api_key.*|authorization|prompt.*|response.*)$"
      {{- if gt (int .Values.inference.gpusPerReplica) 0 }}
      - job_name: inference-gpu-worker-0
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: inference-worker
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            action: keep
            regex: inference-worker-0
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:{{ .Values.inference.metricsPort }}
          - target_label: replica
            replacement: inference-worker-0
          - target_label: component
            replacement: inference-gpu
        metric_relabel_configs:
          - action: labelkeep
            regex: "^(__name__|environment|component|replica|worker|gpu)$"
      - job_name: inference-gpu-worker-1
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: inference-worker
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            action: keep
            regex: inference-worker-1
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:{{ .Values.inference.metricsPort }}
          - target_label: replica
            replacement: inference-worker-1
          - target_label: component
            replacement: inference-gpu
        metric_relabel_configs:
          - action: labelkeep
            regex: "^(__name__|environment|component|replica|worker|gpu)$"
      {{- end }}
      {{- end }}
      {{- if .Values.dcgmExporter.enabled }}
      - job_name: dcgm-exporter
        static_configs:
          - targets: ["dcgm-exporter:{{ .Values.dcgmExporter.port }}"]
            labels:
              component: dcgm-exporter
        metric_relabel_configs:
          - action: labeldrop
            regex: "^(api_key.*|authorization|prompt.*|response.*)$"
      {{- end }}
      {{- if .Values.nodeExporter.enabled }}
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:{{ .Values.nodeExporter.port }}
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - target_label: component
            replacement: node-exporter
        metric_relabel_configs:
          - action: labeldrop
            regex: "^(api_key.*|authorization|prompt.*|response.*)$"
      {{- end }}
      {{- if .Values.kubeStateMetrics.enabled }}
      # kube-state-metrics is a confidential workload. The c8s mesh guard drops
      # a connection to it through its Service address, so scrape its pod.
      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: kube-state-metrics
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:{{ .Values.kubeStateMetrics.port }}
          - target_label: component
            replacement: kube-state-metrics
        metric_relabel_configs:
          - action: labeldrop
            regex: "^(api_key.*|authorization|prompt.*|response.*)$"
      {{- end }}
  {{- if .Values.metricsCollector.tls.enabled }}
  web.yml: |
    tls_server_config:
      cert_file: /mnt/c8s-data/prometheus-tls/tls.crt
      key_file: /mnt/c8s-data/prometheus-tls/tls.key
      client_auth_type: RequireAndVerifyClientCert
      client_ca_file: /mnt/c8s-data/prometheus-client-ca/ca.crt
  {{- end }}
{{- end }}
