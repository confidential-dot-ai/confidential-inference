{{- if and .Values.gateway.state.enabled .Values.gateway.state.storageResources.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-state-mounter
  namespace: {{ .Values.gateway.state.storageNamespace }}
data:
  mount.sh: |
    #!/bin/sh
    set -eu
    device=/dev/gateway-state
    target=/host-state-root/data
    environment={{ .Values.environment | quote }}
    serial={{ .Values.gateway.state.diskSerial | quote }}
    allow_format={{ .Values.gateway.state.allowFormat | quote }}
    marker="$target/.confidential-inference-volume.json"

    fail() { echo "gateway-state-mounter: $1" >&2; exit 1; }
    trim_ascii() {
      LC_ALL=C sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
    }
    [ -b "$device" ] || fail "the configured device is not a block device"
    device_type="$(lsblk -dnro TYPE "$device" | trim_ascii)"
    child_count="$(lsblk -nrpo TYPE "$device" | wc -l | trim_ascii)"
    [ "$device_type" = disk ] || fail "the device is not a whole disk"
    [ "$child_count" = 1 ] || fail "the disk has partitions or child mappings"
    filesystem="$(blkid -o value -s TYPE "$device" 2>/dev/null || true)"
    if [ -z "$filesystem" ]; then
      [ "$allow_format" = true ] || fail "the blank disk cannot be formatted"
      command -v cmp >/dev/null 2>&1 || fail "cmp is required for the blank disk check"
      bytes="$(blockdev --getsize64 "$device")"
      [ "$bytes" -gt 0 ] || fail "the disk size is invalid"
      cmp -n "$bytes" "$device" /dev/zero || fail "the disk has unrecognized nonzero content"
      mkfs.ext4 -F -L confai-gateway-state "$device"
      filesystem=ext4
    fi
    [ "$filesystem" = ext4 ] || fail "the disk filesystem is not ext4"

    mkdir -p "$(dirname "$target")"
    [ ! -L "$target" ] || fail "the mount target is a symlink"
    if [ ! -e "$target" ]; then
      mkdir "$target"
    fi
    target_migration=none
    target_type="$(stat -c '%F' "$target" 2>/dev/null || true)"
    target_major_minor="$(lsblk -dnro MAJ:MIN "$target" 2>/dev/null | trim_ascii || true)"
    expected_device="$(lsblk -dnro MAJ:MIN "$device" | trim_ascii)"
    mount_target="$(findmnt -n -o TARGET --mountpoint "$target" 2>/dev/null || true)"
    mount_target="$(printf '%s' "$mount_target" | trim_ascii)"
    mount_source="$(findmnt -n -o SOURCE --mountpoint "$target" 2>/dev/null || true)"
    mount_source="$(printf '%s' "$mount_source" | trim_ascii)"
    mount_filesystem="$(findmnt -n -o FSTYPE --mountpoint "$target" 2>/dev/null || true)"
    mount_filesystem="$(printf '%s' "$mount_filesystem" | trim_ascii)"
    mount_options="$(findmnt -n -o OPTIONS --mountpoint "$target" 2>/dev/null || true)"
    mount_options="$(printf '%s' "$mount_options" | trim_ascii)"
    mountpoint_exact=false
    [ "$mount_target" = "$target" ] && mountpoint_exact=true
    printf 'gateway-state-mounter: preMount targetType="%s" targetMajorMinor="%s" claimedMajorMinor="%s" mountpointExact=%s source="%s" fstype="%s" options="%s"\n' \
      "$target_type" "$target_major_minor" "$expected_device" "$mountpoint_exact" "$mount_source" "$mount_filesystem" "$mount_options" >&2
    expected_device="$(lsblk -dnro MAJ:MIN "$device" | trim_ascii)"
    mount_target="$(findmnt -n -o TARGET --mountpoint "$target" 2>/dev/null || true)"
    mount_target="$(printf '%s' "$mount_target" | trim_ascii)"
    existing_device="$(findmnt -n -o MAJ:MIN --mountpoint "$target" 2>/dev/null || true)"
    existing_device="$(printf '%s' "$existing_device" | trim_ascii)"
    existing_filesystem="$(findmnt -n -o FSTYPE --mountpoint "$target" 2>/dev/null || true)"
    existing_filesystem="$(printf '%s' "$existing_filesystem" | trim_ascii)"
    if [ "$mount_target" = "$target" ] && [ "$existing_device" = "$expected_device" ] && [ "$existing_filesystem" = ext4 ]; then
      :
    else
      if [ "$mount_target" = "$target" ] && [ "$existing_filesystem" != overlay ]; then
        fail "an unexpected filesystem owns the exact host mount path"
      fi
      if [ "$mount_target" != "$target" ]; then
        case "$target_type" in
          "block special file")
            [ "$target_major_minor" = "$expected_device" ] || fail "the unmounted target device does not match the claimed device"
            rm -f -- "$target"
            mkdir "$target"
            target_migration=removed-unmounted-matching-block-device-node
            ;;
          directory)
            [ -z "$(find "$target" -mindepth 1 -maxdepth 1 -print -quit)" ] || fail "the host mount directory is not empty"
            ;;
          "")
            fail "the mount target type is absent"
            ;;
          *)
            fail "the mount target is not an unmounted directory or matching block device"
            ;;
        esac
      fi
      set +e
      fsck.ext4 -p "$device"
      status=$?
      set -e
      [ "$status" -le 1 ] || fail "the ext4 filesystem check failed"
      mount -t ext4 -o rw,nodev,nosuid,noexec "$device" "$target"
    fi

    verify_exact_mount() {
      expected_device="$(lsblk -dnro MAJ:MIN "$device" | trim_ascii)"
      mount_target="$(findmnt -n -o TARGET --mountpoint "$target" 2>/dev/null || true)"
      mount_target="$(printf '%s' "$mount_target" | trim_ascii)"
      mountpoint_exact=false
      if [ "$mount_target" = "$target" ]; then
        mountpoint_exact=true
      fi
      mounted_device="$(findmnt -n -o MAJ:MIN --mountpoint "$target" 2>/dev/null || true)"
      mounted_device="$(printf '%s' "$mounted_device" | trim_ascii)"
      mounted_source="$(findmnt -n -o SOURCE --mountpoint "$target" 2>/dev/null || true)"
      mounted_source="$(printf '%s' "$mounted_source" | trim_ascii)"
      filesystem_type="$(findmnt -n -o FSTYPE --mountpoint "$target" 2>/dev/null || true)"
      filesystem_type="$(printf '%s' "$filesystem_type" | trim_ascii)"
      options="$(findmnt -n -o OPTIONS --mountpoint "$target" 2>/dev/null || true)"
      options="$(printf '%s' "$options" | trim_ascii)"
      printf 'gateway-state-mounter: mountpointExact=%s mountTarget="%s" claimedMajorMinor="%s" mountedMajorMinor="%s" source="%s" fstype="%s" options="%s"\n' \
        "$mountpoint_exact" "$mount_target" "$expected_device" "$mounted_device" "$mounted_source" "$filesystem_type" "$options" >&2
      [ "$mountpoint_exact" = true ] || return 1
      [ "$mounted_device" = "$expected_device" ] || return 1
      [ "$filesystem_type" = ext4 ] || return 1
      for option in rw nodev nosuid noexec; do
        echo ",$options," | grep -q ",$option," || return 1
      done
    }
    verify_exact_mount || fail "the exact host mount does not match the claimed device"

    uuid="$(blkid -o value -s UUID "$device")"
    [ -n "$uuid" ] || fail "the filesystem UUID is absent"
    temporary="$target/.volume-marker.$$"
    umask 022
    printf '{"schemaVersion":"confidential.ai/gateway-state-volume/v1","environment":"%s","serial":"%s","filesystemType":"ext4","filesystemUuid":"%s","targetMigration":"%s"}\n' \
      "$environment" "$serial" "$uuid" "$target_migration" > "$temporary"
    chmod 0444 "$temporary"
    chown 0:0 "$temporary"
    mv -f "$temporary" "$marker"
    chown 65532:65532 "$target"
    # Match Kubernetes fsGroup root-directory policy before the gateway pod
    # mounts this volume. OnRootMismatch then leaves the root-owned marker
    # unchanged and the gateway cannot rewrite its own trust marker.
    chmod 2770 "$target"

    while :; do
      current_target="$(findmnt -n -o TARGET --mountpoint "$target" 2>/dev/null || true)"
      current_target="$(printf '%s' "$current_target" | trim_ascii)"
      [ "$current_target" = "$target" ] || fail "the gateway state disk became unmounted"
      sleep 30
    done
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gateway-state-mounter
  namespace: {{ .Values.gateway.state.storageNamespace }}
  labels:
    app.kubernetes.io/component: gateway-state-mounter
    confidential.ai/environment: {{ .Values.environment }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-state-mounter
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-state-mounter
        app.kubernetes.io/part-of: confidential-inference
        app.kubernetes.io/component: gateway-state-mounter
        confidential.ai/environment: {{ .Values.environment }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.gateway.state.nodeName }}
      containers:
        - name: mounter
          image: {{ .Values.images.stateMounter }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/confidential-inference/mount.sh"]
          args: []
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
            runAsUser: 0
            seccompProfile:
              type: Unconfined
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["sh", "-ceu", "test \"$(findmnt -n -o TARGET --mountpoint /host-state-root/data 2>/dev/null || true)\" = /host-state-root/data"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-ceu", "test \"$(findmnt -n -o TARGET --mountpoint /host-state-root/data 2>/dev/null || true)\" = /host-state-root/data"]
            periodSeconds: 30
          volumeMounts:
            - name: script
              mountPath: /opt/confidential-inference
              readOnly: true
            - name: host-state
              mountPath: /host-state-root
              mountPropagation: Bidirectional
            - name: tmp
              mountPath: /tmp
          volumeDevices:
            - name: device
              devicePath: /dev/gateway-state
      volumes:
        - name: script
          configMap:
            name: gateway-state-mounter
            defaultMode: 0555
        - name: device
          persistentVolumeClaim:
            claimName: gateway-state-device
        - name: host-state
          hostPath:
            path: {{ .Values.gateway.state.hostStateRootPath }}
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gateway-state-device
  annotations:
    helm.sh/resource-policy: keep
spec:
  capacity:
    storage: {{ .Values.gateway.state.size }}
  volumeMode: Block
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: confidential-inference-gateway-state-device
  local:
    path: {{ .Values.gateway.state.devicePath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [{{ .Values.gateway.state.nodeName | quote }}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-state-device
  namespace: kube-system
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  volumeMode: Block
  storageClassName: confidential-inference-gateway-state-device
  volumeName: gateway-state-device
  resources:
    requests:
      storage: {{ .Values.gateway.state.size }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: confidential-inference-gateway-state-device
  annotations:
    helm.sh/resource-policy: keep
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.gateway.state.persistentVolumeName }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  capacity:
    storage: {{ .Values.gateway.state.size }}
  volumeMode: Filesystem
  accessModes: ["ReadWriteOnce"]
  mountOptions: [rw, nodev, nosuid, noexec]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.gateway.state.storageClassName }}
  local:
    path: {{ .Values.gateway.state.hostMountPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [{{ .Values.gateway.state.nodeName | quote }}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.gateway.state.claimName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  volumeMode: Filesystem
  storageClassName: {{ .Values.gateway.state.storageClassName }}
  volumeName: {{ .Values.gateway.state.persistentVolumeName }}
  resources:
    requests:
      storage: {{ .Values.gateway.state.size }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: confidential-inference-gateway-state-owner
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  validations:
    - expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.persistentVolumeClaim) ||
          v.persistentVolumeClaim.claimName != {{ .Values.gateway.state.claimName | quote }} ||
          (has(object.metadata.labels) && object.metadata.labels['app.kubernetes.io/component'] == 'gateway' &&
           has(object.metadata.annotations) && object.metadata.annotations['confidential.ai/cw'] == 'gateway'))
      message: "Only the measured gateway pod can reference the gateway state claim."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: confidential-inference-gateway-state-owner
spec:
  policyName: confidential-inference-gateway-state-owner
  validationActions: [Deny]
{{- end }}
