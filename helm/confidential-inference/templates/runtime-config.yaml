{{- /* The gateway settings are pinned environment. The router reads its
       routes file once at start; its pod template carries a checksum of the
       routes, so a change rolls the router. */}}
{{- define "confidential-inference.modelRoutes" -}}
{{- $routes := .Values.runtimeConfig.modelRoutes }}
{{- if not $routes }}
{{- $routes = dict .Values.inference.model.name (list .Values.inference.model.name) }}
{{- end }}
{{- toJson $routes }}
{{- end }}

{{- define "confidential-inference.gatewaySettings" -}}
{{- $names := keys (include "confidential-inference.modelRoutes" . | fromJson) | sortAlpha }}
{{- $settings := dict "schemaVersion" 1 "catalogModelIds" $names "inferenceModelIds" $names "attestationCacheSeconds" .Values.runtimeConfig.attestationCacheSeconds }}
{{- if .Values.router.enabled }}
{{- $_ := set $settings "routerService" (include "confidential-inference.routerService" .) }}
{{- end }}
{{- range $key := list "maximumBodyBytes" "upstreamTimeoutSeconds" "bodyTimeoutSeconds" "streamIdleTimeoutSeconds" "globalRequestConcurrency" "perAddressConcurrency" "inferenceConcurrency" "inferenceQueue" "queueTimeoutSeconds" "perKeyConcurrency" "attestationConcurrency" "requestsPerAddressPerSecond" }}
{{- $_ := set $settings $key (index $.Values.gateway.protection $key) }}
{{- end }}
{{- toJson $settings }}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.runtimeConfig.routerConfigMap }}
  labels:
    {{- include "confidential-inference.labels" . | nindent 4 }}
    app.kubernetes.io/component: sglang-router
data:
  {{- /* The router image still requires a revision field; it is constant. */}}
  routes.json: {{ toJson (dict "schemaVersion" 1 "revision" 1 "routes" (include "confidential-inference.modelRoutes" . | fromJson)) | quote }}
